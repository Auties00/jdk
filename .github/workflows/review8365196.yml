name: 'JDK-8365196 review: benchmarks of the workaround'

# Review-only: runs review8365196/PollBench.java with the workaround build of run 44003093072
# (branch JDK-8365196-workaround-ci), flag on and off in the same binary, interleaved.

on:
  push:
    branches:
      - 'JDK-8365196-review-perf*'

permissions:
  actions: read
  contents: read

jobs:
  perf:
    name: perf (${{ matrix.slot }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: review8365196
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: bundles
          run-id: 44003093072
          github-token: ${{ github.token }}
      - name: 'Benchmarks'
        run: |
          set +e
          mkdir -p out jdk; unzip -q bundles/jdk-windows-x64.zip -d jdk
          bin=$(dirname "$(find jdk -name java.exe -path '*/bin/*' | head -1)")
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()" | tee out/cpu.txt
          "$bin/java" -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version | grep -E ' (UseAVX|UseBranchLoopSafepointPolls|ImplicitNullChecks) ' | tee out/flags.txt
          "$bin/javac" -d pb review8365196/PollBench.java
          for round in 1 2 3 4 5 6; do
            for v in "-XX:+UseBranchLoopSafepointPolls -XX:+ImplicitNullChecks" "-XX:-UseBranchLoopSafepointPolls -XX:+ImplicitNullChecks" "-XX:+UseBranchLoopSafepointPolls -XX:-ImplicitNullChecks"; do
              "$bin/java" -XX:+UnlockDiagnosticVMOptions $v -cp pb PollBench all 3 1 9 2>&1 | sed "s|^|round=$round [$v] |" | tee -a out/bench.txt
            done
          done
          { echo "### $(cat out/cpu.txt)"; echo '```'; cat out/bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-${{ matrix.slot }}
          path: out
          retention-days: 30
