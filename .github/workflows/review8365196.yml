name: 'JDK-8365196 review: trigger search'

# Review-only (not for upstream): standalone XSTATE probe variants and JVM-side factors
# (affinity, worker threads, GC/compiler threads) on windows-latest.

on:
  push:
    branches:
      - 'JDK-8365196-review-probe*'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.slot }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: review8365196
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Auties00/jdk-c2-avx512-windows-repro
          path: repro
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: b-base
          run-id: 43956005275
          github-token: ${{ github.token }}
      - name: 'Run'
        run: |
          set +e
          mkdir -p out
          cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()")
          build=$(powershell -NoProfile -Command "\$v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'; \"\$(\$v.ProductName) \$(\$v.CurrentBuild).\$(\$v.UBR)\"")
          echo "HOST: $cpu | $build" | tee out/host.txt
          clang -O2 -o probe.exe review8365196/xstate_block_probe.c
          clang -O2 -shared -o probe.dll review8365196/xstate_block_probe.c
          mkdir -p jdk-base; unzip -q b-base/jdk-windows-x64.zip -d jdk-base
          jbase=$(find jdk-base -name java.exe -path '*/bin/*' | head -1)
          jb=$(dirname "$jbase")
          "$jb/javac" -d ph review8365196/ProbeHost.java
          "$jb/javac" --add-modules jdk.incubator.vector -d c-repro repro/Repro.java 2>&1 | grep -v -i warning
          sp="-XX:+UnlockDiagnosticVMOptions -XX:+SafepointALot -XX:GuaranteedSafepointInterval=1"
          for b in wait sleep yield none; do for h in seh veh; do
            echo "## standalone dummy-low: $h low $b" >> out/probe.txt
            PROBE_DUMMY=1 ./probe.exe $h low $b 4 4 >> out/probe.txt 2>&1
            echo "## standalone dummy-vzu: $h vzu $b" >> out/probe.txt
            PROBE_DUMMY=1 ./probe.exe $h vzu $b 4 4 >> out/probe.txt 2>&1
          done; done
          for b in wait none; do
            echo "## jvm+load+safepointalot dummy-low: seh low $b 4 0" >> out/probe.txt
            PROBE_DUMMY=1 "$jbase" $sp --enable-native-access=ALL-UNNAMED -cp ph ProbeHost ./probe.dll "seh low $b 4 0" load >> out/probe.txt 2>&1
          done
          "$jbase" -Xmx512m $sp -XX:+StressGCM -XX:+StressLCM -XX:StressSeed=29 -XX:-CreateCoredumpOnCrash --add-modules jdk.incubator.vector -cp c-repro Repro field 4 4 > out/repro-29.log 2>&1
          echo "REPRO control seed=29 exit=$?" | tee -a out/summary.txt
          cat out/probe.txt
          { echo "### $(head -1 out/host.txt)"; echo '```'; grep -E "^##|RESULT|masks|corrupted" out/probe.txt; cat out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-${{ matrix.slot }}
          path: out
          retention-days: 30
