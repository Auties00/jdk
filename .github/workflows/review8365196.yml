name: 'JDK-8365196 review: trigger search'

# Review-only (not for upstream): standalone XSTATE probe variants and JVM-side factors
# (affinity, worker threads, GC/compiler threads) on windows-latest.

on:
  push:
    branches:
      - 'JDK-8365196-review-probe*'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.slot }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: review8365196
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Auties00/jdk-c2-avx512-windows-repro
          path: repro
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: b-base
          run-id: 43956005275
          github-token: ${{ github.token }}
      - name: 'Run'
        run: |
          set +e
          mkdir -p out
          cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()")
          build=$(powershell -NoProfile -Command "\$v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'; \"\$(\$v.ProductName) \$(\$v.CurrentBuild).\$(\$v.UBR)\"")
          echo "HOST: $cpu | $build" | tee out/host.txt
          clang -O2 -o probe.exe review8365196/xstate_block_probe.c
          for h in veh seh; do for pre in low vzu high; do for b in none wait sleep; do
            ./probe.exe $h $pre $b 3 4 >> out/probe.txt 2>&1
          done; done; done
          for pre in low high; do ./probe.exe seh $pre wait 3 4 jvmthreads >> out/probe.txt 2>&1; done
          PROBE_DUMMY=1 ./probe.exe seh high wait 3 4 >> out/probe.txt 2>&1
          PROBE_DUMMY=1 ./probe.exe seh low none 3 4 >> out/probe.txt 2>&1
          cat out/probe.txt
          mkdir -p jdk-base; unzip -q b-base/jdk-windows-x64.zip -d jdk-base
          jbase=$(find jdk-base -name java.exe -path '*/bin/*' | head -1)
          "$(dirname $jbase)/javac" --add-modules jdk.incubator.vector -d c-repro repro/Repro.java 2>&1 | grep -v -i warning
          jw=$(cygpath -w "$jbase")
          base="-Xmx512m -XX:+UnlockDiagnosticVMOptions -XX:+SafepointALot -XX:GuaranteedSafepointInterval=1 -XX:+StressGCM -XX:+StressLCM -XX:-CreateCoredumpOnCrash --add-modules jdk.incubator.vector -cp c-repro"
          rr() { # tag seed threads launcher extra...
            local tag=$1 seed=$2 thr=$3 launcher=$4; shift 4
            rm -f hs_err_*.log
            if [ "$launcher" = affinity1 ]; then
              cmd.exe //c "start /b /wait /affinity 1 \"\" \"$jw\" $base -XX:StressSeed=$seed $* Repro field 4 $thr" > out/repro-$tag-$seed.log 2>&1
            else
              "$jbase" $base -XX:StressSeed=$seed "$@" Repro field 4 $thr > out/repro-$tag-$seed.log 2>&1
            fi
            local code=$?
            echo "REPRO $tag seed=$seed exit=$code crash=$(ls hs_err_*.log 2>/dev/null | wc -l)" | tee -a out/summary.txt
          }
          for seed in 25 29; do for r in 1 2; do
            rr default $seed 4 plain
            rr threads1 $seed 1 plain
            rr affinity1 $seed 4 affinity1
            rr fewthreads $seed 1 plain -XX:+UseSerialGC -XX:CICompilerCount=2 -XX:-UseDynamicNumberOfCompilerThreads
            rr bigstack $seed 4 plain -Xss16m
          done; done
          { echo "### $(head -1 out/host.txt)"; echo '```'; grep -A2 RESULT out/probe.txt; cat out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-${{ matrix.slot }}
          path: out
          retention-days: 30
