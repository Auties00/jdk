name: 'JDK-8365196 review: implicit null check leftover (Linux vs Windows)'

# Review-only probe (not for upstream). Runs review8365196/NpeVector.java with Temurin 27 on
# windows-latest, windows-2022 and ubuntu-latest, and the fix bundle (run 43973009181) on
# windows-latest with and without implicit null checks.

on:
  push:
    branches:
      - 'JDK-8365196-review-npe3*'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.os }}, ${{ matrix.slot }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, windows-2022]
        slot: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: review8365196
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: runner.os == 'Windows'
        with:
          name: bundles-windows-x64
          path: b-fix
          run-id: 43973009181
          github-token: ${{ github.token }}
      - name: 'Run'
        run: |
          set +e
          mkdir -p out
          jt=$(command -v java)
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p jdk-fix; unzip -q b-fix/jdk-windows-x64.zip -d jdk-fix
            jfix=$(find jdk-fix -name java.exe -path '*/bin/*' | head -1)
            cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()")
            build=$(powershell -NoProfile -Command "\$v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'; \"\$(\$v.ProductName) \$(\$v.CurrentBuild).\$(\$v.UBR)\"")
          else
            cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-); build="$(. /etc/os-release; echo $PRETTY_NAME) $(uname -r)"
          fi
          echo "HOST: $cpu | $build" | tee out/host.txt
          "$jt" -version 2>&1 | head -2 | tee -a out/host.txt
          "$jt" -XX:+PrintFlagsFinal -version 2>/dev/null | grep -E ' (UseAVX|MaxVectorSize) ' | tee -a out/host.txt
          javac --add-modules jdk.incubator.vector -d c review8365196/NpeVector.java 2>&1 | grep -v -i warning
          common="-XX:-TieredCompilation -Xbatch -XX:PerMethodTrapLimit=100000 -XX:PerBytecodeTrapLimit=100000 -XX:PerMethodRecompilationCutoff=-1 -XX:PerBytecodeRecompilationCutoff=-1 -XX:CompileCommand=quiet -XX:-CreateCoredumpOnCrash -XX:+UnlockDiagnosticVMOptions -XX:CompileCommand=exclude,NpeVector::reference --add-modules jdk.incubator.vector"
          run() { # java tag seed extra...
            local j=$1 tag=$2 seed=$3; shift 3
            "$j" $common -XX:+StressGCM -XX:+StressLCM -XX:StressSeed=$seed "$@" -Xlog:gc:file=out/gc-$tag-$seed.log -cp c NpeVector 8 > out/npe-$tag-$seed.log 2>&1
            echo "NPE $tag seed=$seed exit=$? $(grep -m1 RESULT out/npe-$tag-$seed.log) $(grep -m1 -E 'MISMATCH' out/npe-$tag-$seed.log) gcs=$(grep -c Pause out/gc-$tag-$seed.log)" | tee -a out/summary.txt
          }
          for seed in 1 2 3 4 5 6 7 8; do run "$jt" temurin $seed; done
          if [ "$RUNNER_OS" = Windows ]; then
            for r in 1 2 3; do
              run "$jfix" fix-r$r 1
              run "$jfix" fix-noinc-r$r 1 -XX:-ImplicitNullChecks
              run "$jfix" fix-epsilon-r$r 1 -XX:+UnlockExperimentalVMOptions -XX:+UseEpsilonGC -Xmx4g
            done
          fi
          { echo "### $(head -1 out/host.txt)"; echo '```'; cat out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-${{ matrix.os }}-${{ matrix.slot }}
          path: out
          retention-days: 30
