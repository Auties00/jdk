name: 'JDK-8365196 sveprobe build (Arm64 binaries for local VMs)'

on:
  push:
    branches:
      - 'JDK-8365196-ci-sveprobe-*'

permissions:
  contents: read

jobs:
  sveprobe:
    name: sveprobe build
    runs-on: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: 'Build and run'
        run: |
          set +e
          mkdir -p out /c/probe
          cp sveprobe/* /c/probe/
          cd /c/probe
          cmd //c "$(pwd -W)\sbuild.cmd" > $GITHUB_WORKSPACE/out/build.txt 2>&1
          cat $GITHUB_WORKSPACE/out/build.txt
          ./kver.exe > $GITHUB_WORKSPACE/out/kver.txt 2>&1
          ./sveprobe.exe > $GITHUB_WORKSPACE/out/sveprobe.txt 2>&1
          echo "exit=$?" >> $GITHUB_WORKSPACE/out/sveprobe.txt
          cat $GITHUB_WORKSPACE/out/kver.txt $GITHUB_WORKSPACE/out/sveprobe.txt
          cp sveprobe.exe kver.exe setfeat.exe p3agent.exe $GITHUB_WORKSPACE/out/
          true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sveprobe-bin
          path: out
          retention-days: 30
