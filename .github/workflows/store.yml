name: 'JDK-8365196 scrub6: scrub store forms'

# Review-only: cost of the scrub's store forms in a pointer-chasing vector loop (review6/storebench.c).

on:
  push:
    branches:
      - 'JDK-8365196-ci-scrub6-store*'

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.os }} ${{ matrix.slot }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        slot: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: review6
      - name: 'Run'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()")
            clang -O2 -mavx2 review6/storebench.c -o sb.exe
          else
            cpu=$(grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //')
            gcc -O2 -mavx2 review6/storebench.c -o sb.exe
          fi
          echo "CPU: $cpu" | tee out.txt
          ./sb.exe | tee -a out.txt
          ./sb.exe | tee -a out.txt
          { echo "### $cpu"; echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-${{ matrix.os }}-${{ matrix.slot }}
          path: out.txt
