name: 'JDK-8365196 notrap CI'

# Review-only. Builds the notrap branch (windows-x64 and linux-x64, release and fastdebug) and tests
# AvoidLosableStateAtTraps: tier1 on linux-x64, windows-2022 (a kernel that keeps the state) and
# windows-2025 (Windows Server 2025, whose gated kernel loses it); the compiler groups and the vector
# tests on windows-2025 with the mode on by default; the linux-x64 compiler groups with the mode
# forced, so that its debug checks run on every compilation; and the reproducers on windows-2025 and
# windows-2022 with the notrap build (mode on, mode off) against the unpatched base and scrub14.
# Windows/AArch64 and the other Linux builds go through the OpenJDK GHA Sanity Checks (main.yml,
# dispatched on this branch).

on:
  push:
    branches:
      - 'JDK-8365196-ci-notrap-*'

permissions:
  actions: read
  contents: read

env:
  # The unpatched base (2b376fb353c), as copied by run 45043642784.
  BASE_RUN: 46023299763
  # scrub14 (c6f997c2c66), as built by run 45112930164.
  SCRUB14_RUN: 46023299763
  # The builds of round 14.
  BUILD_RUN: 46043336189
  # A notrap CI run of the branch before the cost branches (2fc793f7a63), for the bench.
  NOTRAP_RUN: 45896947412
  # The CI run of cost-kmask (73360dc3de3): the mode without the protection of the vectors that reach a check.
  KMASK_RUN: 45961686077
  JMH_ARGS: '-f 2 -wi 4 -i 6 -w 1 -r 1'

jobs:
  prepare:
    name: 'Prepare'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github
            make/conf/github-actions.conf
      - name: 'Build JTReg'
        uses: ./.github/actions/build-jtreg

  repro:
    name: repro (${{ matrix.os }}, ${{ matrix.slot }})
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        slot: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: jtreg
        uses: ./.github/actions/get-jtreg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: bundles
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-debug
          path: bundles-kmask
          run-id: ${{ env.KMASK_RUN }}
          github-token: ${{ github.token }}
      - name: 'The lane check kernel with a page error, on the fastdebug build of cost-kmask, with its code'
        run: |
          set +e
          mkdir -p out jdk kmask tests
          unzip -q bundles/jdk-windows-x64.zip -d jdk
          unzip -q bundles-kmask/jdk-windows-x64-debug.zip -d kmask || unzip -q "$(ls bundles-kmask/*.zip | head -1)" -d kmask
          tar -xzf bundles/tests-windows-x64.tar.gz -C tests
          home() { (cd "$(dirname "$(find "$1" -name java.exe -path '*/bin/*' | head -1)")/.." && pwd -W); }
          JDK=$(home jdk); KMASK=$(home kmask)
          NAT=$(cd "$(dirname "$(find tests -name ExceptionXState.dll | head -1)")" && pwd -W)
          JT='${{ steps.jtreg.outputs.path }}'
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()" | tee out/cpu.txt
          "$KMASK/bin/java" -version 2>&1 | tee out/version.txt
          "$JDK/bin/java" -jar "$JT/lib/jtreg.jar" -jdk:"$KMASK" -nativepath:"$NAT" -w wk -r rp -timeoutFactor:8 -verbose:summary             -vmoptions:"-XX:-CreateCoredumpOnCrash -Dtest.xstate.vhd=true -Dtest.xstate.fill=true -XX:CompileCommand=PrintOptoAssembly,*TestCheckedVectorsAtRawAccesses::laneCheckKernel"             "test/hotspot/jtreg/compiler/runtime/safepoints/TestCheckedVectorsAtRawAccesses.java#fault" > out/jtreg.txt 2>&1
          tail -5 out/jtreg.txt
          find wk -name '*.jtr' -exec cp {} out/ \;
          grep -E "^(laneCheckKernel|gatherKernel|userCheckKernel|page error)" out/*.jtr
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: repro-${{ matrix.os }}-${{ matrix.slot }}
          path: out
          retention-days: 30

