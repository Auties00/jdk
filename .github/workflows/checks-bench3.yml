name: 'JDK-8365196 cost-checks bench 3'

# Review-only. The third pass of the cost-checks bench on windows-2025, for C1 in xmm16-31: the register pressure
# kernels and the scalar review kernels with C1 only, review7 and review10 with every tier, and Renaissance.
# Configurations: B the unpatched base, N the notrap branch (round 11 bundles), C the cost-checks branch, O the
# cost-checks branch with the mode off.

on:
  push:
    branches:
      - 'JDK-8365196-ci-checksbench3-*'

permissions:
  actions: read
  contents: read

env:
  # The notrap CI run whose bundles are N (notrap) and B (base).
  NOTRAP_RUN: 45856843905
  # The cost-checks CI run whose bundles are C.
  CHECKS_RUN: 45948142657

jobs:
  bench:
    name: bench (${{ matrix.os }}, ${{ matrix.slot }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        slot: [1, 2, 3, 4, 5]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src
          sparse-checkout: |
            review2
            review3
            review5
            review6
            review7
            review10
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: b-notrap
          run-id: ${{ env.NOTRAP_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-base
          path: b-base
          run-id: ${{ env.NOTRAP_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: b-checks
          run-id: ${{ env.CHECKS_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-debug
          path: b-checks-debug
          run-id: ${{ env.CHECKS_RUN }}
          github-token: ${{ github.token }}
      - name: 'JMH and Renaissance: base (B), notrap (N), cost-checks (C), cost-checks mode off (O)'
        run: |
          set +e
          mkdir -p out notrap base checks checksd
          unzip -q b-notrap/jdk-windows-x64.zip -d notrap; unzip -q b-base/jdk-windows-x64.zip -d base
          unzip -q b-checks/jdk-windows-x64.zip -d checks; unzip -q "$(ls b-checks-debug/jdk-windows-x64*.zip | head -1)" -d checksd
          bin() { dirname "$(find "$1" -name java.exe -path '*/bin/*' | head -1)"; }
          NBIN=$(bin notrap); BBIN=$(bin base); CBIN=$(bin checks); DBIN=$(bin checksd)
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()" | tee out/cpu.txt
          powershell -NoProfile -Command "\$v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'; \"\$(\$v.ProductName) \$(\$v.CurrentBuild).\$(\$v.UBR)\"" | tee out/build.txt
          "$CBIN/java" -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version | grep -E ' (UseAVX|MaxVectorSize|AvoidLosableStateAtTraps|UseFPUForSpilling|IntelJccErratumMitigation|OptoLoopAlignment|CodeEntryAlignment) ' | tee out/flags.txt
          m2=https://repo1.maven.org/maven2
          for a in org/openjdk/jmh/jmh-core/1.37/jmh-core-1.37.jar org/openjdk/jmh/jmh-generator-annprocess/1.37/jmh-generator-annprocess-1.37.jar net/sf/jopt-simple/jopt-simple/5.0.4/jopt-simple-5.0.4.jar org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar; do
            curl -sfL -o "lib-$(basename $a)" "$m2/$a" || echo "download failed: $a"
          done
          cp="lib-jmh-core-1.37.jar;lib-jopt-simple-5.0.4.jar;lib-commons-math3-3.6.1.jar"
          "$BBIN/javac" --add-modules jdk.incubator.vector -proc:full -cp "$cp;lib-jmh-generator-annprocess-1.37.jar" -d jmhc \
            src/review2/R2Bench.java src/review3/R3Bench.java src/review5/R5Bench.java src/review6/R6Bench.java \
            src/review7/R7Bench.java src/review10/R10Bench.java 2>&1 | grep -v -i warning | tail -5
          declare -A JAVA FLAGS
          JAVA[B]="$BBIN/java"; FLAGS[B]=""
          JAVA[N]="$NBIN/java"; FLAGS[N]=""
          JAVA[C]="$CBIN/java"; FLAGS[C]=""
          JAVA[O]="$CBIN/java"; FLAGS[O]="-XX:+UnlockDiagnosticVMOptions -XX:-AvoidLosableStateAtTraps"
          jmh() { # tag config forks extra-jvm-args pattern
            local tag=$1 c=$2 forks=$3 extra=$4 pattern=$5
            "${JAVA[$c]}" -cp "jmhc;$cp" org.openjdk.jmh.Main \
              -jvmArgsAppend "--add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED ${FLAGS[$c]} $extra" \
              -rf csv -rff "out/$tag.csv" -f $forks -wi 3 -i 5 -w 1 -r 1 "$pattern" > "out/$tag.log" 2>&1
          }
          for v in 0.16.1 0.16.0 0.15.0; do
            curl -sfL -o renaissance.jar "https://github.com/renaissance-benchmarks/renaissance/releases/download/v$v/renaissance-gpl-$v.jar" && break
          done
          # 1. C1 only: the register pressure kernels and the scalar review kernels
          for round in 1 2 3; do
            order="B N C O"; [ $round = 2 ] && order="N C O B"; [ $round = 3 ] && order="C O B N"
            for c in $order; do
              jmh "c1-$c-$round" $c 2 "-XX:TieredStopAtLevel=1" "R10Bench.scalarFpPressure|R10Bench.gprPressureUnsafe|review2.R2Bench|R7Bench.listWalkScalar|R7Bench.nullCheckScalar|R5Bench.listWalkScalar|R6Bench.uncountedListWalkScalar"
              tail -22 "out/c1-$c-$round.log"
            done
          done
          # 2. Every tier: review7 and review10
          for round in 1 2; do
            order="B N C O"; [ $round = 2 ] && order="C O B N"
            for c in $order; do
              jmh "jmh-$c-$round" $c 2 "" "review7.R7Bench|review10.R10Bench"
            done
          done
          # 3. Renaissance
          RB="scrabble future-genetic mnemonics fj-kmeans dotty"
          for round in 1 2; do
            order="N C O"; [ $round = 2 ] && order="C O N"
            for b in $RB; do
              for c in $order; do
                timeout 900 "${JAVA[$c]}" ${FLAGS[$c]} -Xms2g -Xmx2g -jar renaissance.jar -r 10 --csv "out/ren-$b-$c-$round.csv" $b > "out/ren-$b-$c-$round.log" 2>&1 || echo "renaissance $b $c failed: $(tail -3 out/ren-$b-$c-$round.log | tr '\n' ' ')"
              done
            done
          done
          { echo "### $(cat out/cpu.txt) | $(cat out/build.txt)"; echo '```'; cat out/flags.txt out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-${{ matrix.os }}-${{ matrix.slot }}
          path: out
          retention-days: 30
