name: 'JDK-8365196 review 2: JMH and Renaissance'

# Review-only. JMH micro benchmarks (review2/R2Bench.java) and a Renaissance subset with three flag settings of one
# binary, interleaved: trap polls + implicit null checks (old default), branch polls + implicit null checks, branch
# polls + explicit null checks (the new default on Windows with AVX-512). Windows uses the final workaround build
# (run 44027944984); Linux uses the release build of run 44027964926 (final code, default forced on; the flags are
# always given explicitly, and the generated code does not depend on the OS).

on:
  push:
    branches:
      - 'JDK-8365196-review2-perf*'

permissions:
  actions: read
  contents: read

jobs:
  perf:
    name: perf (${{ matrix.os }}, ${{ matrix.slot }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, slot: 1, run: 44027944984, artifact: bundles-windows-x64 }
          - { os: windows-latest, slot: 2, run: 44027944984, artifact: bundles-windows-x64 }
          - { os: windows-latest, slot: 3, run: 44027944984, artifact: bundles-windows-x64 }
          - { os: ubuntu-24.04, slot: 1, run: 44027964926, artifact: bundles-linux-x64 }
          - { os: ubuntu-24.04, slot: 2, run: 44027964926, artifact: bundles-linux-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: review2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: bundles
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
      - name: 'Benchmarks'
        run: |
          set +e
          mkdir -p out jdk
          if [ "$RUNNER_OS" = Windows ]; then
            unzip -q bundles/jdk-windows-x64.zip -d jdk
            bin=$(dirname "$(find jdk -name java.exe -path '*/bin/*' | head -1)")
            powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()" > out/cpu.txt
            sep=';'
          else
            tar xzf bundles/jdk-linux-x64.tar.gz -C jdk
            bin=$(dirname "$(find jdk -name java -path '*/bin/*' -type f | head -1)")
            grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //' > out/cpu.txt
            sep=':'
          fi
          cat out/cpu.txt
          "$bin/java" -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version | grep -E ' (UseAVX|MaxVectorSize|UseBranchLoopSafepointPolls|ImplicitNullChecks|IntelJccErratumMitigation) ' | tee out/flags.txt
          m2=https://repo1.maven.org/maven2
          for a in org/openjdk/jmh/jmh-core/1.37/jmh-core-1.37.jar org/openjdk/jmh/jmh-generator-annprocess/1.37/jmh-generator-annprocess-1.37.jar net/sf/jopt-simple/jopt-simple/5.0.4/jopt-simple-5.0.4.jar org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar; do
            curl -sfL -o "lib-$(basename $a)" "$m2/$a" || echo "download failed: $a"
          done
          cp="lib-jmh-core-1.37.jar${sep}lib-jopt-simple-5.0.4.jar${sep}lib-commons-math3-3.6.1.jar"
          "$bin/javac" -proc:full -cp "$cp${sep}lib-jmh-generator-annprocess-1.37.jar" -d jmhc review2/R2Bench.java 2>&1 | tail -5
          for v in 0.16.1 0.16.0 0.15.0; do
            curl -sfL -o renaissance.jar "https://github.com/renaissance-benchmarks/renaissance/releases/download/v$v/renaissance-gpl-$v.jar" && break
          done
          ls -la renaissance.jar
          A="-XX:+UnlockDiagnosticVMOptions -XX:-UseBranchLoopSafepointPolls -XX:+ImplicitNullChecks"
          B="-XX:+UnlockDiagnosticVMOptions -XX:+UseBranchLoopSafepointPolls -XX:+ImplicitNullChecks"
          C="-XX:+UnlockDiagnosticVMOptions -XX:+UseBranchLoopSafepointPolls -XX:-ImplicitNullChecks"
          for round in 1 2; do
            for c in A B C; do
              eval "flags=\$$c"
              "$bin/java" -cp "jmhc${sep}$cp" org.openjdk.jmh.Main -jvmArgsAppend "$flags" -rf csv -rff "out/jmh-$c-$round.csv" -f 2 -wi 4 -i 6 -w 1 -r 1 review2.R2Bench > "out/jmh-$c-$round.log" 2>&1
              tail -12 "out/jmh-$c-$round.log"
            done
          done
          RB="scrabble mnemonics par-mnemonics fj-kmeans future-genetic akka-uct scala-kmeans scala-doku dotty reactors rx-scrabble philosophers"
          for round in 1 2 3; do
            for b in $RB; do
              for c in A B C; do
                eval "flags=\$$c"
                timeout 600 "$bin/java" $flags -Xms2g -Xmx2g -jar renaissance.jar -r 16 --csv "out/ren-$b-$c-$round.csv" $b > "out/ren-$b-$c-$round.log" 2>&1 || echo "renaissance $b $c failed: $(tail -3 out/ren-$b-$c-$round.log | tr '\n' ' ')"
              done
            done
          done
          echo "done"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf2-${{ matrix.os }}-${{ matrix.slot }}
          path: out
          retention-days: 30
