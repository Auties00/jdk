name: 'JDK-8365196 cost-checks diag'

# Review-only. Runs single tests with the windows-aarch64 fastdebug bundle of a cost-checks CI run,
# with the mode on and off, to tell a failure of the mode from one of the base.

on:
  push:
    branches:
      - 'JDK-8365196-ci-checksdiag-*'

permissions:
  actions: read
  contents: read

env:
  CHECKS_RUN: 45905096158

jobs:
  prepare:
    name: 'Prepare'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github
            make/conf/github-actions.conf
      - name: 'Build JTReg'
        uses: ./.github/actions/build-jtreg

  diag:
    name: 'diag, windows-aarch64'
    needs: prepare
    runs-on: windows-11-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: jtreg
        uses: ./.github/actions/get-jtreg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-aarch64-debug
          path: bundles
          run-id: ${{ env.CHECKS_RUN }}
          github-token: ${{ github.token }}
      - name: 'TestMaskedNotAllOnes and the tests of the mode, mode on and off'
        run: |
          set +e
          mkdir -p out jdk tests
          unzip -q "$(ls bundles/jdk-windows-aarch64*.zip | head -1)" -d jdk
          tar -xzf "$(ls bundles/tests-windows-aarch64*.tar.gz | head -1)" -C tests
          JDK=$(cd "$(dirname "$(find jdk -name java.exe -path '*/bin/*' | head -1)")/.." && pwd -W)
          NAT=$(cd "$(dirname "$(find tests -name '*.dll' -path '*hotspot/jtreg/native*' | head -1)")" && pwd -W)
          JT='${{ steps.jtreg.outputs.path }}'
          jt() {
            local tag=$1 opts=$2 test=$3
            "$JDK/bin/java" -jar "$JT/lib/jtreg.jar" -jdk:"$JDK" -nativepath:"$NAT" -w "wk/$tag" -r "rp/$tag" \
              -timeoutFactor:8 -verbose:summary -vmoptions:"-XX:-CreateCoredumpOnCrash $opts" $test > "out/jtreg-$tag.txt" 2>&1
            local pass=$(grep -c '^Passed: ' "out/jtreg-$tag.txt")
            local fail=$(grep -c -E '^(FAILED|Error): ' "out/jtreg-$tag.txt")
            mkdir -p "out/jtr/$tag"; find "wk/$tag" -name '*.jtr' -exec cp {} "out/jtr/$tag/" \; 2>/dev/null
            local why=$(cat out/jtr/$tag/*.jtr 2>/dev/null | grep -m1 -E 'assert\(|Internal Error' | cut -c1-160)
            echo "SUMMARY [$tag] passed=$pass failed=$fail :: $why" | tee -a out/summary.txt
          }
          OFF="-XX:+UnlockDiagnosticVMOptions -XX:-AvoidLosableStateAtTraps"
          SEED="-Djdk.test.lib.random.seed=2507606996873054018"
          MASKED=test/hotspot/jtreg/compiler/vectorapi/TestMaskedNotAllOnes.java
          MODE=test/hotspot/jtreg/compiler/runtime/safepoints/TestAvoidLosableStateAtTraps.java
          jt masked-on-seed "$SEED" $MASKED
          jt masked-off-seed "$OFF $SEED" $MASKED
          jt masked-on-1 "" $MASKED
          jt masked-off-1 "$OFF" $MASKED
          jt masked-on-2 "" $MASKED
          jt masked-off-2 "$OFF" $MASKED
          jt mode-on "" $MODE
          { echo '```'; cat out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: diag-windows-aarch64
          path: out
          retention-days: 30
