name: 'JDK-8365196 mxcsr CI'

# Review-only. The correctness gate of the MXCSR cost work on AvoidLosableStateAtTraps: builds
# windows-x64 (release and fastdebug), windows-aarch64 and linux-x64 (fastdebug), and runs
# TestMXCSRRestore with the other JNI tests, java/foreign and the tests of the mode on Windows x64
# (windows-2025, whose kernel loses the state, and windows-2022), on Windows/AArch64 and on linux-x64
# with the mode forced; then TestExceptionXStateLoss on windows-2025 with the mode on (it must pass)
# and off (it must fail there).

on:
  push:
    branches:
      - 'JDK-8365196-ci-mxcsr-*'

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: 'Prepare'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github
            make/conf/github-actions.conf
      - name: 'Build JTReg'
        uses: ./.github/actions/build-jtreg

  build-windows-x64:
    name: windows-x64
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      platform: windows-x64
      runs-on: windows-2022
      architecture: 'x86.x64'
      msvc-toolset-version: '14.44'

  build-windows-aarch64:
    name: windows-aarch64
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      platform: windows-aarch64
      runs-on: windows-11-arm
      architecture: 'ARM64'
      msvc-toolset-version: '14.51'
      debug-levels: '[ "debug" ]'

  build-linux-x64:
    name: linux-x64
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux-x64
      gcc-major-version: '10'
      debug-levels: '[ "debug" ]'

  test-windows-2025:
    name: 'windows-2025'
    needs: [prepare, build-windows-x64]
    uses: ./.github/workflows/test-scrub5.yml
    with:
      platform: windows-x64
      bootjdk-platform: windows-x64
      architecture: 'x86.x64'
      runs-on: windows-2025
      tag: w2025
      tests: '[{"test-name": "hs/jni", "test-suite": "test/hotspot/jtreg/runtime/jni", "debug-suffix": "-debug"}, {"test-name": "hs/jni release", "test-suite": "test/hotspot/jtreg/runtime/jni", "debug-suffix": ""}, {"test-name": "hs/safepoints", "test-suite": "test/hotspot/jtreg/compiler/runtime/safepoints", "debug-suffix": "-debug"}, {"test-name": "jdk/foreign", "test-suite": "test/jdk/java/foreign", "debug-suffix": "-debug"}, {"test-name": "jdk/foreign release", "test-suite": "test/jdk/java/foreign", "debug-suffix": ""}]'

  test-windows-2022:
    name: 'windows-2022'
    needs: [prepare, build-windows-x64]
    uses: ./.github/workflows/test-scrub5.yml
    with:
      platform: windows-x64
      bootjdk-platform: windows-x64
      architecture: 'x86.x64'
      runs-on: windows-2022
      tag: w2022
      tests: '[{"test-name": "hs/jni", "test-suite": "test/hotspot/jtreg/runtime/jni", "debug-suffix": "-debug"}, {"test-name": "hs/safepoints", "test-suite": "test/hotspot/jtreg/compiler/runtime/safepoints", "debug-suffix": "-debug"}, {"test-name": "jdk/foreign", "test-suite": "test/jdk/java/foreign", "debug-suffix": "-debug"}]'

  test-windows-aarch64:
    name: 'windows-aarch64'
    needs: [prepare, build-windows-aarch64]
    uses: ./.github/workflows/test-scrub5.yml
    with:
      platform: windows-aarch64
      bootjdk-platform: windows-aarch64
      architecture: 'ARM64'
      runs-on: windows-11-arm
      tag: waarch64
      tests: '[{"test-name": "hs/jni", "test-suite": "test/hotspot/jtreg/runtime/jni", "debug-suffix": "-debug"}, {"test-name": "hs/safepoints", "test-suite": "test/hotspot/jtreg/compiler/runtime/safepoints", "debug-suffix": "-debug"}, {"test-name": "jdk/foreign", "test-suite": "test/jdk/java/foreign", "debug-suffix": "-debug"}]'

  test-linux-x64-forced:
    name: 'linux-x64, mode forced'
    needs: [prepare, build-linux-x64]
    uses: ./.github/workflows/test-scrub5.yml
    with:
      platform: linux-x64
      bootjdk-platform: linux-x64
      runs-on: ubuntu-24.04
      tag: linux-forced
      java-options: '-XX:+UnlockDiagnosticVMOptions -XX:+AvoidLosableStateAtTraps'
      tests: '[{"test-name": "hs/jni", "test-suite": "test/hotspot/jtreg/runtime/jni", "debug-suffix": "-debug"}, {"test-name": "jdk/foreign", "test-suite": "test/jdk/java/foreign", "debug-suffix": "-debug"}]'

  xstate:
    name: xstate loss (${{ matrix.os }}, ${{ matrix.slot }})
    needs: [prepare, build-windows-x64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, slot: 1 }
          - { os: windows-2025, slot: 2 }
          - { os: windows-2022, slot: 1 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: jtreg
        uses: ./.github/actions/get-jtreg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: bundles
      - name: 'TestExceptionXStateLoss and TestMXCSRRestore, the mode on and off'
        run: |
          set +e
          mkdir -p out jdk tests
          unzip -q bundles/jdk-windows-x64.zip -d jdk
          tar -xzf bundles/tests-windows-x64.tar.gz -C tests
          JDK=$(cd "$(dirname "$(find jdk -name java.exe -path '*/bin/*' | head -1)")/.." && pwd -W)
          NAT=$(cd "$(dirname "$(find tests -name ExceptionXState.dll | head -1)")" && pwd -W)
          JT='${{ steps.jtreg.outputs.path }}'
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()" | tee out/cpu.txt
          powershell -NoProfile -Command "\$v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'; \"\$(\$v.ProductName) \$(\$v.CurrentBuild).\$(\$v.UBR)\"" | tee out/build.txt
          "$JDK/bin/java" -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version | grep -E ' (UseAVX|MaxVectorSize|AvoidLosableStateAtTraps) ' | tee out/flags.txt
          jt() {
            local tag=$1 opts=$2 test=$3
            "$JDK/bin/java" -jar "$JT/lib/jtreg.jar" -jdk:"$JDK" -nativepath:"$NAT" -w "wk/$tag" -r "rp/$tag" \
              -timeoutFactor:4 -verbose:summary -vmoptions:"-XX:-CreateCoredumpOnCrash $opts" $test > "out/jtreg-$tag.txt" 2>&1
            local pass=$(grep -c '^Passed: ' "out/jtreg-$tag.txt")
            local fail=$(grep -c -E '^(FAILED|Error): ' "out/jtreg-$tag.txt")
            mkdir -p "out/jtr/$tag"; find "wk/$tag" -name '*.jtr' -exec cp {} "out/jtr/$tag/" \; 2>/dev/null
            echo "SUMMARY [$tag] passed=$pass failed=$fail $(grep -E '^(FAILED|Error): ' "out/jtreg-$tag.txt" | sed 's/.*#//' | tr '\n' ' ')" | tee -a out/summary.txt
          }
          LOSS=test/hotspot/jtreg/compiler/runtime/safepoints/TestExceptionXStateLoss.java
          MXCSR=test/hotspot/jtreg/runtime/jni/mxcsr/TestMXCSRRestore.java
          OFF="-XX:+UnlockDiagnosticVMOptions -XX:-AvoidLosableStateAtTraps"
          for r in 1 2; do
            jt "on-$r" "" "$LOSS"
            jt "off-$r" "$OFF" "$LOSS"
          done
          jt "mxcsr" "" "$MXCSR"
          { echo "### $(cat out/cpu.txt) | $(cat out/build.txt)"; echo '```'; cat out/flags.txt out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # The mode on must pass everywhere; off must fail on the kernel that loses the state.
          grep -E '^SUMMARY \[(on-[12]|mxcsr)\]' out/summary.txt | grep -v ' failed=0 ' && exit 1
          if grep -q ' 26100\.' out/build.txt; then
            grep -E '^SUMMARY \[off-[12]\]' out/summary.txt | grep -q -v ' failed=0 ' || { echo "the mode off did not fail on 26100"; exit 1; }
          fi
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: xstate-${{ matrix.os }}-${{ matrix.slot }}
          path: out
          retention-days: 30
