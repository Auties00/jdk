name: 'JDK-8365196 scrub7: planter experiment'

on:
  push:
    branches:
      - 'JDK-8365196-ci-scrub7-plant*'

permissions:
  actions: read
  contents: read

jobs:
  plant:
    name: plant (${{ matrix.slot }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: review7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: bundles
          run-id: 44343210778
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-base
          path: bundles-base
          run-id: 44343210778
          github-token: ${{ github.token }}
      - name: 'Planters'
        run: |
          set +e
          mkdir -p jdk base out; unzip -q bundles/jdk-windows-x64.zip -d jdk; unzip -q bundles-base/jdk-windows-x64.zip -d base
          FIX=$(dirname "$(find jdk -name java.exe -path '*/bin/*' | head -1)")
          BASE=$(dirname "$(find base -name java.exe -path '*/bin/*' | head -1)")
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()" | tee out/cpu.txt
          inc=$(cd "$BASE/../include" && pwd -W)
          clang -O2 -shared -o PlantExp.dll review7/libPlantExp.c -I"$inc" -I"$inc/win32"
          "$BASE/javac" --add-modules jdk.incubator.vector -d cls review7/PlantExp.java 2>&1 | grep -v -i warning
          common="--add-modules jdk.incubator.vector -Djava.library.path=. -XX:+UseSerialGC -XX:+UnlockDiagnosticVMOptions -XX:CompileCommand=quiet -XX:CompileCommand=exclude,PlantFiller::run -XX:CompileCommand=dontinline,PlantExp::c2plant -XX:CompileCommand=dontinline,PlantExp::callee -XX:PerMethodTrapLimit=100000 -XX:PerBytecodeTrapLimit=100000 -XX:PerMethodRecompilationCutoff=-1 -XX:PerBytecodeRecompilationCutoff=-1"
          for jdk in BASE FIX; do
            eval "bin=\$$jdk"
            for trap in poll npe; do
              extra=""; [ $trap = poll ] && extra="-XX:+SafepointALot -XX:GuaranteedSafepointInterval=1"
              for p in none native interp c2; do
                r=$("$bin/java" $common $extra -cp cls PlantExp $p $trap 8 2>&1 | grep RESULT)
                echo "$jdk $r" | tee -a out/summary.txt
              done
            done
          done
          { echo "### $(cat out/cpu.txt)"; echo '```'; cat out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: plant-${{ matrix.slot }}
          path: out
