name: 'JDK-8365196 review6: scrub8 adversarial kernels, startup and cost'

# Review-only (review6). Uses the scrub8 bundles of run 44637207461 (head 70e3fb5997e) and the
# unpatched base bundle of the same run; nothing is rebuilt.
#  windows: R6 kernels (empty catch handler, catch with work, GC barrier slow paths under G1/Z/
#           Shenandoah, OSR) on release fix vs base, fastdebug fix + VerifyExceptionXStateScrub;
#           PrintOptoAssembly of the shapes; the rcl cost shape; startup time; AMX check.
#  linux:   fastdebug with L forced + check (deterministic placement), release cost with L forced.

on:
  push:
    branches:
      - 'JDK-8365196-review6-k*'

permissions:
  actions: read
  contents: read

env:
  RUN: 44637207461

jobs:
  windows:
    name: windows (${{ matrix.os }}, ${{ matrix.slot }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, slot: 1 }
          - { os: windows-2025, slot: 2 }
          - { os: windows-2025, slot: 3 }
          - { os: windows-2025, slot: 4 }
          - { os: windows-2025, slot: 5 }
          - { os: windows-2025, slot: 6 }
          - { os: windows-2025, slot: 7 }
          - { os: windows-2025, slot: 8 }
          - { os: windows-2022, slot: 1 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            review6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: bundles-windows-x64, path: b-new, run-id: '${{ env.RUN }}', github-token: '${{ github.token }}' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: bundles-windows-x64-debug, path: b-dbg, run-id: '${{ env.RUN }}', github-token: '${{ github.token }}' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: bundles-windows-x64-base, path: b-base, run-id: '${{ env.RUN }}', github-token: '${{ github.token }}' }
      - name: 'Run'
        run: |
          set +e
          mkdir -p out new dbg base
          unzip -q b-new/jdk-windows-x64.zip -d new; unzip -q b-base/jdk-windows-x64.zip -d base
          unzip -q "$(ls b-dbg/jdk-windows-x64*debug*.zip | grep -v symbols | head -1)" -d dbg
          home() { cd "$(dirname "$(find $1 -name java.exe -path '*/bin/*' | head -1)")/.." && pwd -W; }
          NEW=$(home new); BASE=$(home base); DBG=$(home dbg)
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()" > out/cpu.txt
          powershell -NoProfile -Command "\$v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'; \"\$(\$v.ProductName) \$(\$v.CurrentBuild).\$(\$v.UBR)\"" > out/os.txt
          (cd review6/probe && cmd //c "$(pwd -W)\\build.cmd" > ../../out/build-probe.txt 2>&1 && ./xprobe.exe > ../../out/probe.txt 2>&1)
          cd review6/java
          cat > jbuild.cmd <<EOF
          @echo off
          set "VSWHERE=C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (\`call "%%VSWHERE%%" -latest -products * -property installationPath\`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" >nul
          cl /nologo /O2 /LD /I"$NEW\include" /I"$NEW\include\win32" r6jni.c /link /OUT:r6jni.dll
          EOF
          cmd //c "$(pwd -W)\\jbuild.cmd" > ../../out/build-jni.txt 2>&1
          JNI="$(pwd -W)/r6jni.dll"
          cd ../..
          "$NEW/bin/java" -Xlog:os+cpu=info -version > out/new-oscpu.txt 2>&1
          common="--add-modules jdk.incubator.vector -Dr6.jni=$JNI -XX:-TieredCompilation -XX:+UnlockDiagnosticVMOptions -XX:+SafepointALot -XX:GuaranteedSafepointInterval=1"
          for spec in ecatch:G1 hcatch:G1 barrier:G1 barrier:Z barrier:Shenandoah osr:G1; do
            k=${spec%%:*}; gc=${spec#*:}
            for tag in NEW BASE; do
              j=${!tag}
              "$j/bin/java" -XX:+Use${gc}GC $common review6/java/R6.java $k 10000 > out/$k-$gc-$tag.txt 2>&1
              echo "[$k $gc $tag exit=$?] $(grep '^R6 ' out/$k-$gc-$tag.txt)" >> out/summary.txt
            done
            "$DBG/bin/java" -XX:+Use${gc}GC $common -XX:+VerifyExceptionXStateScrub -XX:-CreateCoredumpOnCrash review6/java/R6.java $k 8000 > out/$k-$gc-DBG.txt 2>&1
            echo "[$k $gc DBG-verify exit=$?] $(grep '^R6 ' out/$k-$gc-DBG.txt) $(grep -o 'stale XSAVE header[^:]*\|assert[^\n]*' out/$k-$gc-DBG.txt | head -1)" >> out/summary.txt
          done
          for m in ecatch hcatch rcl; do
            "$DBG/bin/java" $common -XX:CompileCommand=quiet -XX:CompileCommand=option,R6::$m,PrintOptoAssembly review6/java/R6.java $( [ $m = rcl ] && echo rcl || echo $m ) 3000 > out/opto-$m.txt 2>&1
          done
          # Cost of the rcl shape, interleaved, release fix vs base.
          for r in 1 2 3; do
            for tag in NEW BASE; do
              j=${!tag}
              for k in rcl rcl0; do
                "$j/bin/java" --add-modules jdk.incubator.vector -Dr6.jni=$JNI -XX:-TieredCompilation review6/java/R6.java $k 6000 2>/dev/null | sed "s/^/$tag /" >> out/perf.txt
              done
            done
          done
          # Startup: 40 interleaved runs of -version, wall ms.
          for i in $(seq 1 40); do
            for tag in NEW BASE; do
              j=${!tag}
              s=$(date +%s%N); "$j/bin/java" -Xshare:auto -version >/dev/null 2>&1; e=$(date +%s%N)
              echo "$tag $(( (e - s) / 1000 ))" >> out/startup.txt
            done
          done
          "$NEW/bin/java" -Xlog:os+cpu=debug:file=out/oscpu-debug.txt:uptimenanos -version > /dev/null 2>&1
          "$NEW/bin/java" -Xlog:startuptime -version > out/startuptime-new.txt 2>&1
          "$BASE/bin/java" -Xlog:startuptime -version > out/startuptime-base.txt 2>&1
          { echo "### ${{ matrix.os }} slot ${{ matrix.slot }}: $(cat out/cpu.txt) | $(cat out/os.txt)"; echo '```'; grep -E '^(xcr0|A L=)' out/probe.txt; grep -i "xstate\|exception" out/new-oscpu.txt; cat out/summary.txt; grep "round=2" out/perf.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          amx=$(grep -c 'amx=1' out/probe.txt); echo "amx=$amx" >> out/amx.txt
          if [ "$amx" != 0 ]; then
            LIB="$(pwd -W)/review6/probe/r5native.dll"
            for tag in NEW BASE; do j=${!tag}; for i in 1 2; do
              "$j/bin/java" --add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED -Dr5.lib="$LIB" \
                -XX:+UnlockDiagnosticVMOptions -XX:+SafepointALot -XX:GuaranteedSafepointInterval=1 \
                review6/java/R5Amx.java 8000 > out/r5amx-$tag-$i.txt 2>&1
              echo "R5AMX $tag $i exit=$? $(grep R5AMX out/r5amx-$tag-$i.txt)" >> out/amx.txt
            done; done
            cat out/amx.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: r6-${{ matrix.os }}-${{ matrix.slot }}
          path: out
          retention-days: 30

  linux:
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            review6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: bundles-linux-x64-debug, path: b-dbg, run-id: '${{ env.RUN }}', github-token: '${{ github.token }}' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: bundles-linux-x64, path: b-new, run-id: '${{ env.RUN }}', github-token: '${{ github.token }}' }
      - name: 'Run'
        run: |
          set +e
          mkdir -p out dbg new
          tar -xzf "$(ls b-dbg/jdk-linux-x64*debug*.tar.gz | grep -v symbols | head -1)" -C dbg
          tar -xzf "$(ls b-new/jdk-linux-x64*.tar.gz | grep -v symbols | grep -v debug | head -1)" -C new
          DBG=$(cd "$(dirname "$(find dbg -name java -path '*/bin/*' -type f | head -1)")/.." && pwd)
          NEW=$(cd "$(dirname "$(find new -name java -path '*/bin/*' -type f | head -1)")/.." && pwd)
          gcc -O2 -shared -fPIC -I"$DBG/include" -I"$DBG/include/linux" -o review6/java/libr6jni.so review6/java/r6jni.c 2> out/build-jni.txt
          grep -m1 'model name' /proc/cpuinfo > out/cpu.txt
          JNI=$(pwd)/review6/java/libr6jni.so
          common="--add-modules jdk.incubator.vector -Dr6.jni=$JNI -XX:-TieredCompilation -XX:+UnlockDiagnosticVMOptions -XX:ExceptionXStateLength=1920 -XX:+SafepointALot -XX:GuaranteedSafepointInterval=1"
          for spec in ecatch:G1 hcatch:G1 barrier:G1 barrier:Z barrier:Shenandoah osr:G1; do
            k=${spec%%:*}; gc=${spec#*:}
            "$DBG/bin/java" -XX:+Use${gc}GC $common -XX:+VerifyExceptionXStateScrub -XX:-CreateCoredumpOnCrash review6/java/R6.java $k 8000 > out/$k-$gc-verify.txt 2>&1
            echo "[$k $gc verify exit=$?] $(grep '^R6 ' out/$k-$gc-verify.txt) $(grep -o 'stale XSAVE header[^:]*' out/$k-$gc-verify.txt | head -1)" >> out/summary.txt
          done
          for m in ecatch hcatch rcl; do
            "$DBG/bin/java" $common -XX:CompileCommand=quiet -XX:CompileCommand=option,R6::$m,PrintOptoAssembly review6/java/R6.java $m 3000 > out/opto-$m.txt 2>&1
          done
          for r in 1 2 3; do
            for L in 0 1920; do
              for k in rcl rcl0; do
                "$NEW/bin/java" --add-modules jdk.incubator.vector -Dr6.jni=$JNI -XX:-TieredCompilation -XX:+UnlockDiagnosticVMOptions -XX:ExceptionXStateLength=$L review6/java/R6.java $k 6000 2>/dev/null | sed "s/^/L=$L /" >> out/perf.txt
              done
            done
          done
          { echo "### linux: $(cat out/cpu.txt)"; echo '```'; cat out/summary.txt; grep "round=2" out/perf.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: r6-linux
          path: out
          retention-days: 30
