name: 'JDK-8365196 detect: changed tests on Windows Server 2025'

# Review-only. Runs the tests this series adds or changes, from this branch's sources, against the windows-x64
# debug bundle built by run 44205806202 from JDK-8365196-detect-selftest (same HotSpot code), on Server 2025,
# where the self-test changes the defaults, and on Server 2022, where it does not.

on:
  push:
    branches:
      - 'JDK-8365196-detect-ci-jtreg*'

permissions:
  actions: read
  contents: read

jobs:
  jtreg:
    name: jtreg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
        slot: [1, 2, 3]
        exclude:
          - { os: windows-2022, slot: 2 }
          - { os: windows-2022, slot: 3 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            test/hotspot/jtreg
            test/lib
            test/jtreg-ext
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-debug
          path: bundles
          run-id: 44205806202
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-jtreg-8.3+1
          path: jtreg
          run-id: 44205806202
          github-token: ${{ github.token }}
      - name: 'jtreg'
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          set +e
          mkdir -p jdk out
          ls bundles
          unzip -q bundles/jdk-windows-x64-debug.zip -d jdk
          JDK=$(cygpath -m "$(dirname "$(dirname "$(find "$PWD/jdk" -name java.exe -path '*/bin/*' -type f | head -1)")")")
          JT=$(cygpath -m "$(find "$PWD/jtreg" -name jtreg.jar | head -1)")
          ROOT=$(cygpath -m "$PWD")
          {
            powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name"
            powershell -NoProfile -Command "\$v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'; \$v.ProductName + ' ' + \$v.CurrentBuild + '.' + \$v.UBR"
            "$JDK/bin/java" -Xlog:os+cpu -version 2>&1 | grep -E "Resuming from an exception|build"
            "$JDK/bin/java" -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version 2>/dev/null | grep -E " (UseBranchLoopSafepointPolls|ImplicitNullChecks|UseUpperXMMRegistersInC1|UseAVX) "
          } | tee out/host.txt
          "$JDK/bin/java" -jar "$JT" -jdk:"$JDK" -dir:"$ROOT/test/hotspot/jtreg" -exclude:"$ROOT/test/hotspot/jtreg/ProblemList.txt" \
            -conc:2 -timeoutFactor:8 -verbose:summary -retain:fail,error -w:"$ROOT/work" -r:"$ROOT/out/report" \
            compiler/gcbarriers/TestImplicitNullChecks.java compiler/runtime/safepoints compiler/runtime/Test7196199.java > out/jtreg.txt 2>&1
          echo "jtreg exit $?" | tee -a out/summary.txt
          grep -E '^(Passed|FAILED|Error|Test results)' out/jtreg.txt | tee -a out/summary.txt
          mkdir -p out/jtr
          find work -name '*.jtr' -exec cp {} out/jtr/ \;
          { echo '```'; cat out/host.txt out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jtreg-${{ matrix.os }}-${{ matrix.slot }}
          path: out
          retention-days: 30
