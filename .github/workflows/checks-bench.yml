name: 'JDK-8365196 cost-checks bench'

# Review-only. The cost of the compiled-code shapes of AvoidLosableStateAtTraps, before and after the
# cost-checks branch, on windows-2025. Configurations: B the unpatched base, N the notrap branch
# (round 11 bundles), C the cost-checks branch, O the cost-checks branch with the mode off.
# - C2 code size of -Xcomp -XX:-TieredCompilation -version per collector;
# - the opto assembly of the kernels with the fastdebug build of C (the shapes on this processor);
# - JMH, interleaved rounds: the review kernels (review2, 3, 5, 6, 7) and the kernels of review10;
# - the megamorphic and null check kernels fork by fork (their times are multimodal);
# - the null check kernel with loops aligned to 64 bytes;
# - the register pressure kernels with C1 only and with UseFPUForSpilling;
# - Renaissance (scrabble, future-genetic, mnemonics, fj-kmeans, dotty) with N, C and O.

on:
  push:
    branches:
      - 'JDK-8365196-ci-checksbench-*'

permissions:
  actions: read
  contents: read

env:
  # The notrap CI run whose bundles are N (notrap) and B (base).
  NOTRAP_RUN: 45856843905
  # The cost-checks CI run whose bundles are C.
  CHECKS_RUN: 45905096158

jobs:
  bench:
    name: bench (${{ matrix.os }}, ${{ matrix.slot }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        slot: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src
          sparse-checkout: |
            review2
            review3
            review5
            review6
            review7
            review10
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: b-notrap
          run-id: ${{ env.NOTRAP_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-base
          path: b-base
          run-id: ${{ env.NOTRAP_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: b-checks
          run-id: ${{ env.CHECKS_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-debug
          path: b-checks-debug
          run-id: ${{ env.CHECKS_RUN }}
          github-token: ${{ github.token }}
      - name: 'Code size, opto assembly, JMH and Renaissance: base (B), notrap (N), cost-checks (C), cost-checks mode off (O)'
        run: |
          set +e
          mkdir -p out notrap base checks checksd
          unzip -q b-notrap/jdk-windows-x64.zip -d notrap; unzip -q b-base/jdk-windows-x64.zip -d base
          unzip -q b-checks/jdk-windows-x64.zip -d checks; unzip -q "$(ls b-checks-debug/jdk-windows-x64*.zip | head -1)" -d checksd
          bin() { dirname "$(find "$1" -name java.exe -path '*/bin/*' | head -1)"; }
          NBIN=$(bin notrap); BBIN=$(bin base); CBIN=$(bin checks); DBIN=$(bin checksd)
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()" | tee out/cpu.txt
          powershell -NoProfile -Command "\$v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'; \"\$(\$v.ProductName) \$(\$v.CurrentBuild).\$(\$v.UBR)\"" | tee out/build.txt
          "$CBIN/java" -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version | grep -E ' (UseAVX|MaxVectorSize|AvoidLosableStateAtTraps|UseFPUForSpilling|IntelJccErratumMitigation|OptoLoopAlignment|CodeEntryAlignment) ' | tee out/flags.txt
          m2=https://repo1.maven.org/maven2
          for a in org/openjdk/jmh/jmh-core/1.37/jmh-core-1.37.jar org/openjdk/jmh/jmh-generator-annprocess/1.37/jmh-generator-annprocess-1.37.jar net/sf/jopt-simple/jopt-simple/5.0.4/jopt-simple-5.0.4.jar org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar; do
            curl -sfL -o "lib-$(basename $a)" "$m2/$a" || echo "download failed: $a"
          done
          cp="lib-jmh-core-1.37.jar;lib-jopt-simple-5.0.4.jar;lib-commons-math3-3.6.1.jar"
          "$BBIN/javac" --add-modules jdk.incubator.vector -proc:full -cp "$cp;lib-jmh-generator-annprocess-1.37.jar" -d jmhc \
            src/review2/R2Bench.java src/review3/R3Bench.java src/review5/R5Bench.java src/review6/R6Bench.java \
            src/review7/R7Bench.java src/review10/R10Bench.java 2>&1 | grep -v -i warning | tail -5
          for v in 0.16.1 0.16.0 0.15.0; do
            curl -sfL -o renaissance.jar "https://github.com/renaissance-benchmarks/renaissance/releases/download/v$v/renaissance-gpl-$v.jar" && break
          done
          declare -A JAVA FLAGS
          JAVA[B]="$BBIN/java"; FLAGS[B]=""
          JAVA[N]="$NBIN/java"; FLAGS[N]=""
          JAVA[C]="$CBIN/java"; FLAGS[C]=""
          JAVA[O]="$CBIN/java"; FLAGS[O]="-XX:+UnlockDiagnosticVMOptions -XX:-AvoidLosableStateAtTraps"
          jmh() { # tag config forks extra-jvm-args pattern
            local tag=$1 c=$2 forks=$3 extra=$4 pattern=$5
            "${JAVA[$c]}" -cp "jmhc;$cp" org.openjdk.jmh.Main \
              -jvmArgsAppend "--add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED ${FLAGS[$c]} $extra" \
              -rf csv -rff "out/$tag.csv" -f $forks -wi 3 -i 5 -w 1 -r 1 "$pattern" > "out/$tag.log" 2>&1
          }
          # 1. C2 code size of -Xcomp -version, per collector
          for c in B N C O; do
            for gc in Serial G1 Z Shenandoah; do
              f=out/xcomp-$c-$gc.txt
              "${JAVA[$c]}" ${FLAGS[$c]} -XX:+Use${gc}GC -Xcomp -XX:-TieredCompilation -XX:+CITime -version > $f 2>&1
              echo "SUMMARY xcomp-version $c $gc $(grep -o 'nmethod code size.*' $f | head -1)" | tee -a out/summary.txt
            done
          done
          # 2. The opto assembly of the kernels, cost-checks fastdebug, mode on and off
          for m in on off; do
            s="+"; [ $m = off ] && s="-"
            "$DBIN/java" -cp "jmhc;$cp" org.openjdk.jmh.Main \
              -jvmArgsAppend "--add-modules jdk.incubator.vector -XX:+UnlockDiagnosticVMOptions -XX:${s}AvoidLosableStateAtTraps -XX:-TieredCompilation -XX:CompileCommand=print,*R7Bench::nullCheckVectorLive -XX:CompileCommand=print,*R7Bench::listWalkVectorLive -XX:CompileCommand=print,*R7Bench::countedLoopVectorLive -XX:CompileCommand=print,*R10Bench::nullCheckVectorDeadOnNullPath -XX:CompileCommand=print,*R10Bench::*Pressure -XX:CompileCommand=print,*R2Bench::megamorphic" \
              -f 1 -wi 3 -i 1 -w 2 -r 1 "R7Bench.nullCheckVectorLive|R7Bench.listWalkVectorLive|R7Bench.countedLoopVectorLive|R10Bench.nullCheckVectorDeadOnNullPath|R10Bench.vectorPressureUnsafe|R10Bench.scalarFpPressureUnsafe|R2Bench.megamorphic$" > "out/asm-$m.log" 2>&1
            echo "SUMMARY asm $m explicit-null-checks=$(grep -c 'explicit null check' out/asm-$m.log) null-checks=$(grep -c 'NullCheck' out/asm-$m.log) polls=$(grep -c 'Safepoint: poll for GC  ' out/asm-$m.log)" | tee -a out/summary.txt
          done
          # 2b. How many trap sites take their non-trapping form (cost-checks fastdebug)
          "$DBIN/java" -XX:+PrintOptoStatistics -Xcomp -XX:-TieredCompilation -version > out/stats-xcomp.txt 2>&1
          echo "SUMMARY sites xcomp-version $(grep -m1 'AvoidLosableStateAtTraps:' out/stats-xcomp.txt)" | tee -a out/summary.txt
          for b in scrabble fj-kmeans; do
            timeout 1200 "$DBIN/java" -XX:+PrintOptoStatistics -Xms2g -Xmx2g -jar renaissance.jar -r 4 $b > out/stats-$b.txt 2>&1
            echo "SUMMARY sites $b $(grep -m1 'AvoidLosableStateAtTraps:' out/stats-$b.txt)" | tee -a out/summary.txt
          done
          "$DBIN/java" -XX:+PrintOptoStatistics -cp "jmhc;$cp" org.openjdk.jmh.Main -jvmArgsAppend "--add-modules jdk.incubator.vector -XX:+PrintOptoStatistics"             -f 1 -wi 2 -i 1 -w 1 -r 1 "review7.R7Bench|review10.R10Bench" > out/stats-jmh.txt 2>&1
          echo "SUMMARY sites review7+10 $(grep 'AvoidLosableStateAtTraps:' out/stats-jmh.txt | tail -1)" | tee -a out/summary.txt
          # 3. The megamorphic and null check kernels fork by fork
          for i in 1 2 3 4 5 6 7 8; do
            order="B N C O"; [ $((i % 4)) = 1 ] && order="N C O B"; [ $((i % 4)) = 2 ] && order="C O B N"; [ $((i % 4)) = 3 ] && order="O B N C"
            for c in $order; do
              jmh "fork-$c-$i" $c 1 "" "R2Bench.megamorphic$|R3Bench.vectorLoopMegamorphicCall|R7Bench.nullCheckVectorLive|R10Bench.nullCheckVectorDeadOnNullPath"
            done
          done
          # 4. The review kernels and review10, interleaved rounds
          for round in 1 2 3; do
            order="B N C O"; [ $round = 2 ] && order="N C O B"; [ $round = 3 ] && order="C O B N"
            for c in $order; do
              jmh "jmh-$c-$round" $c 2 "" "review2.R2Bench|review3.R3Bench|review5.R5Bench|review6.R6Bench|review7.R7Bench|review10.R10Bench"
              tail -45 "out/jmh-$c-$round.log"
            done
          done
          # 5. Variants: loops aligned to 64 bytes, C1 only, FPU spilling
          for round in 1 2; do
            order="B N C O"; [ $round = 2 ] && order="C O B N"
            for c in $order; do
              jmh "align-$c-$round" $c 2 "-XX:CodeEntryAlignment=64 -XX:OptoLoopAlignment=64" "R7Bench.nullCheckVectorLive|R7Bench.nullCheckScalar|R10Bench.nullCheckVectorDeadOnNullPath"
              jmh "c1-$c-$round" $c 2 "-XX:TieredStopAtLevel=1" "R10Bench.scalarFpPressure|R10Bench.gprPressureUnsafe|R2Bench.saxpy|R2Bench.fieldLoads"
              jmh "fpu-$c-$round" $c 2 "-XX:+UseFPUForSpilling" "R10Bench|R2Bench.megamorphic$|R2Bench.hashMapGet"
            done
          done
          # 6. Renaissance
          RB="scrabble future-genetic mnemonics fj-kmeans dotty"
          for round in 1 2; do
            order="N C O"; [ $round = 2 ] && order="C O N"
            for b in $RB; do
              for c in $order; do
                timeout 900 "${JAVA[$c]}" ${FLAGS[$c]} -Xms2g -Xmx2g -jar renaissance.jar -r 10 --csv "out/ren-$b-$c-$round.csv" $b > "out/ren-$b-$c-$round.log" 2>&1 || echo "renaissance $b $c failed: $(tail -3 out/ren-$b-$c-$round.log | tr '\n' ' ')"
              done
            done
          done
          { echo "### $(cat out/cpu.txt) | $(cat out/build.txt)"; echo '```'; cat out/flags.txt out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-${{ matrix.os }}-${{ matrix.slot }}
          path: out
          retention-days: 30

  size-linux:
    name: code size (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-linux-x64
          path: b-notrap
          run-id: ${{ env.NOTRAP_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-linux-x64
          path: b-checks
          run-id: ${{ env.CHECKS_RUN }}
          github-token: ${{ github.token }}
      - name: 'C2 code size per collector: mode off (the upstream code on linux), notrap forced on, cost-checks forced on'
        run: |
          set +e
          mkdir -p out notrap checks
          tar -xzf "$(ls b-notrap/jdk-linux-x64*.tar.gz | grep -v symbols | grep -v debug | head -1)" -C notrap
          tar -xzf "$(ls b-checks/jdk-linux-x64*.tar.gz | grep -v symbols | grep -v debug | head -1)" -C checks
          home() { cd "$(dirname "$(find $1 -name java -path '*/bin/*' -type f | head -1)")/.." && pwd; }
          N=$(home notrap); C=$(home checks)
          grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //' | tee out/cpu.txt
          for gc in Serial G1 Z Shenandoah; do
            for c in off notrap checks; do
              case $c in
                off) j=$C; o="-XX:-AvoidLosableStateAtTraps" ;;
                notrap) j=$N; o="-XX:+AvoidLosableStateAtTraps" ;;
                checks) j=$C; o="-XX:+AvoidLosableStateAtTraps" ;;
              esac
              f=out/xcomp-$c-$gc.txt
              "$j/bin/java" -XX:+UnlockDiagnosticVMOptions $o -XX:+Use${gc}GC -Xcomp -XX:-TieredCompilation -XX:+CITime -version > $f 2>&1
              echo "SUMMARY xcomp-version $c $gc $(grep -o 'nmethod code size.*' $f | head -1)" | tee -a out/summary.txt
            done
          done
          cat out/summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: size-linux
          path: out
          retention-days: 30
