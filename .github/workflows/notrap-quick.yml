name: 'JDK-8365196 notrap quick'

on:
  push:
    branches:
      - 'JDK-8365196-ci-notrapq-*'

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: 'Prepare'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github
            make/conf/github-actions.conf
      - name: 'Build JTReg'
        uses: ./.github/actions/build-jtreg

  build-linux-x64:
    name: linux-x64
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux-x64
      gcc-major-version: '10'

  safepoints-linux-x64:
    name: 'safepoints, flagless, linux-x64'
    needs: [prepare, build-linux-x64]
    uses: ./.github/workflows/test-scrub5.yml
    with:
      platform: linux-x64
      bootjdk-platform: linux-x64
      runs-on: ubuntu-24.04
      debug-suffix: -debug
      tag: quick
      tests: '[{"test-name": "hs/safepoints", "test-suite": "test/hotspot/jtreg/compiler/runtime/safepoints", "debug-suffix": "-debug"}, {"test-name": "hs/safepoints release", "test-suite": "test/hotspot/jtreg/compiler/runtime/safepoints"}]'
