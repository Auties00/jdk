name: 'JDK-8365196 notrap bench'

# Review-only. The cost of killing k1-k7 at raw memory accesses under AvoidLosableStateAtTraps (review9: opmasks
# live across off-heap MemorySegment and Unsafe accesses, with heap-only controls), with the bundles of a run of
# the notrap CI workflow. JMH in interleaved rounds on windows-2025 and windows-2022 (B the unpatched base,
# S scrub14, N notrap, O notrap with the mode off) and on linux (the notrap build, F mode off, T forced on).

on:
  push:
    branches:
      - 'JDK-8365196-ci-notrapbench-*'

permissions:
  actions: read
  contents: read

env:
  NOTRAP_RUN: 45629269246
  JMH_ARGS: '-f 2 -wi 4 -i 6 -w 1 -r 1'

jobs:
  bench:
    name: bench (${{ matrix.os }}, ${{ matrix.slot }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, slot: 1 }
          - { os: windows-2025, slot: 2 }
          - { os: windows-2022, slot: 1 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src
          sparse-checkout: |
            review9
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: b-notrap
          run-id: ${{ env.NOTRAP_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-base
          path: b-base
          run-id: ${{ env.NOTRAP_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-scrub14
          path: b-scrub14
          run-id: ${{ env.NOTRAP_RUN }}
          github-token: ${{ github.token }}
      - name: 'JMH: base (B), scrub14 (S), notrap (N), notrap mode off (O)'
        run: |
          set +e
          mkdir -p out notrap base scrub14
          unzip -q b-notrap/jdk-windows-x64.zip -d notrap; unzip -q b-base/jdk-windows-x64.zip -d base; unzip -q b-scrub14/jdk-windows-x64.zip -d scrub14
          bin() { dirname "$(find "$1" -name java.exe -path '*/bin/*' | head -1)"; }
          NBIN=$(bin notrap); BBIN=$(bin base); SBIN=$(bin scrub14)
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()" | tee out/cpu.txt
          powershell -NoProfile -Command "\$v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'; \"\$(\$v.ProductName) \$(\$v.CurrentBuild).\$(\$v.UBR)\"" | tee out/build.txt
          "$NBIN/java" -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version | grep -E ' (UseAVX|MaxVectorSize|AvoidLosableStateAtTraps) ' | tee out/flags.txt
          m2=https://repo1.maven.org/maven2
          for a in org/openjdk/jmh/jmh-core/1.37/jmh-core-1.37.jar org/openjdk/jmh/jmh-generator-annprocess/1.37/jmh-generator-annprocess-1.37.jar net/sf/jopt-simple/jopt-simple/5.0.4/jopt-simple-5.0.4.jar org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar; do
            curl -sfL -o "lib-$(basename $a)" "$m2/$a" || echo "download failed: $a"
          done
          cp="lib-jmh-core-1.37.jar;lib-jopt-simple-5.0.4.jar;lib-commons-math3-3.6.1.jar"
          "$BBIN/javac" --add-modules jdk.incubator.vector -proc:full -cp "$cp;lib-jmh-generator-annprocess-1.37.jar" -d jmhc src/review9/R9Bench.java 2>&1 | grep -v -i warning | tail -5
          declare -A JAVA FLAGS
          JAVA[B]="$BBIN/java"; FLAGS[B]=""
          JAVA[S]="$SBIN/java"; FLAGS[S]=""
          JAVA[N]="$NBIN/java"; FLAGS[N]=""
          JAVA[O]="$NBIN/java"; FLAGS[O]="-XX:+UnlockDiagnosticVMOptions -XX:-AvoidLosableStateAtTraps"
          for round in 1 2 3; do
            order="B S N O"; [ $round = 2 ] && order="S N O B"; [ $round = 3 ] && order="N O B S"
            for c in $order; do
              "${JAVA[$c]}" -cp "jmhc;$cp" org.openjdk.jmh.Main \
                -jvmArgsAppend "--add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow ${FLAGS[$c]}" \
                -rf csv -rff "out/jmh-$c-$round.csv" $JMH_ARGS "review9.R9Bench" > "out/jmh-$c-$round.log" 2>&1
              tail -12 "out/jmh-$c-$round.log"
            done
          done
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kbench-${{ matrix.os }}-${{ matrix.slot }}
          path: out
          retention-days: 30

  linux:
    name: bench (linux, ${{ matrix.slot }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src
          sparse-checkout: |
            review9
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-linux-x64
          path: b-notrap
          run-id: ${{ env.NOTRAP_RUN }}
          github-token: ${{ github.token }}
      - name: 'JMH: notrap mode off (F) and forced on (T)'
        run: |
          set +e
          mkdir -p out notrap
          tar -xzf "$(ls b-notrap/jdk-linux-x64*.tar.gz | grep -v symbols | grep -v debug | head -1)" -C notrap
          J=$(dirname "$(find notrap -name java -path '*/bin/*' -type f | head -1)")
          grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //' | tee out/cpu.txt
          echo "Linux $(uname -r)" | tee out/build.txt
          "$J/java" -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version | grep -E ' (UseAVX|MaxVectorSize|AvoidLosableStateAtTraps) ' | tee out/flags.txt
          m2=https://repo1.maven.org/maven2
          for a in org/openjdk/jmh/jmh-core/1.37/jmh-core-1.37.jar org/openjdk/jmh/jmh-generator-annprocess/1.37/jmh-generator-annprocess-1.37.jar net/sf/jopt-simple/jopt-simple/5.0.4/jopt-simple-5.0.4.jar org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar; do
            curl -sfL -o "lib-$(basename $a)" "$m2/$a" || echo "download failed: $a"
          done
          cp="lib-jmh-core-1.37.jar:lib-jopt-simple-5.0.4.jar:lib-commons-math3-3.6.1.jar"
          "$J/javac" --add-modules jdk.incubator.vector -proc:full -cp "$cp:lib-jmh-generator-annprocess-1.37.jar" -d jmhc src/review9/R9Bench.java 2>&1 | grep -v -i warning | tail -5
          for round in 1 2 3; do
            order="F T"; [ $round = 2 ] && order="T F"
            for c in $order; do
              f=-XX:-AvoidLosableStateAtTraps; [ $c = T ] && f=-XX:+AvoidLosableStateAtTraps
              "$J/java" -cp "jmhc:$cp" org.openjdk.jmh.Main \
                -jvmArgsAppend "--add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow -XX:+UnlockDiagnosticVMOptions $f" \
                -rf csv -rff "out/jmh-$c-$round.csv" $JMH_ARGS "review9.R9Bench" > "out/jmh-$c-$round.log" 2>&1
              tail -12 "out/jmh-$c-$round.log"
            done
          done
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kbench-linux-${{ matrix.slot }}
          path: out
          retention-days: 30
