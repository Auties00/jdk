name: 'JDK-8365196 detect: scrub prototype, fastdebug, hotspot tier1 compiler on Windows Server 2025'

# Review-only. Builds windows-x64 fastdebug of the scrub prototype and runs the hotspot tier1 compiler tests
# on Server 2025 with trapping polls and implicit null checks forced on, without and with the scrub.

on:
  push:
    branches:
      - 'JDK-8365196-detect-ci-scrub3-debug*'

permissions:
  actions: read
  contents: read

jobs:
  bundles:
    name: bundles
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        name: ['bundles-windows-x64-debug', 'bundles-jtreg-8.3+1']
    steps:
      # the fastdebug build of this branch's HotSpot code, made by the first run of this workflow
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.name }}
          path: bundle
          run-id: 44225382458
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: bundle
          retention-days: 3
          compression-level: 0

  test-windows-x64:
    name: windows-x64
    needs: bundles
    uses: ./.github/workflows/test-scrub.yml
    with:
      platform: windows-x64
      bootjdk-platform: windows-x64
      architecture: 'x86.x64'
      runs-on: windows-2025
      debug-suffix: -debug
