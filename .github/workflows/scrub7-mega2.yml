name: 'JDK-8365196 scrub7: slow forks of vectorLoopMegamorphicCall'

# Review-only. Uses the bundles of scrub7 CI run BUILD_RUN. Some forks of the fix (S) and of the scrub
# before each trap (T) settle 4x slower after the first warmup iteration, the base (B) never did. Runs
# 20 forks of each with -XX:+PrintCompilation and keeps the compilation events of R3Bench, then the
# alignment comparison that the first run lost to a missing -XX:+UnlockExperimentalVMOptions.

on:
  push:
    branches:
      - 'JDK-8365196-ci-scrub7-mega2*'

permissions:
  actions: read
  contents: read

env:
  BUILD_RUN: 44416410474

jobs:
  forks:
    name: forks (${{ matrix.slot }})
    runs-on: windows-2025
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: bundles
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-base
          path: bundles-base
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src
          sparse-checkout: |
            review3
      - name: 'Forks with PrintCompilation, then alignment'
        run: |
          set +e
          mkdir -p out jdk base
          unzip -q bundles/jdk-windows-x64.zip -d jdk; unzip -q bundles-base/jdk-windows-x64.zip -d base
          bin=$(dirname "$(find jdk -name java.exe -path '*/bin/*' | head -1)")
          basebin=$(dirname "$(find base -name java.exe -path '*/bin/*' | head -1)")
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()" | tee out/cpu.txt
          "$bin/java" -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version | grep -E ' (UseAVX|MaxVectorSize|ExceptionXStateLength) ' | tee out/flags.txt
          m2=https://repo1.maven.org/maven2
          for a in org/openjdk/jmh/jmh-core/1.37/jmh-core-1.37.jar org/openjdk/jmh/jmh-generator-annprocess/1.37/jmh-generator-annprocess-1.37.jar net/sf/jopt-simple/jopt-simple/5.0.4/jopt-simple-5.0.4.jar org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar; do
            curl -sfL -o "lib-$(basename $a)" "$m2/$a" || echo "download failed: $a"
          done
          cp="lib-jmh-core-1.37.jar;lib-jopt-simple-5.0.4.jar;lib-commons-math3-3.6.1.jar"
          "$basebin/javac" --add-modules jdk.incubator.vector -proc:full -cp "$cp;lib-jmh-generator-annprocess-1.37.jar" -d jmhc src/review3/R3Bench.java 2>&1 | grep -v -i warning | tail -5
          declare -A JAVA FLAGS
          JAVA[B]="$basebin/java"; FLAGS[B]=""
          JAVA[S]="$bin/java"; FLAGS[S]=""
          JAVA[T]="$bin/java"; FLAGS[T]="-XX:+UnlockDiagnosticVMOptions -XX:+ScrubExceptionXStateHeaderAtTraps"
          for c in S T B; do
            "${JAVA[$c]}" -cp "jmhc;$cp" org.openjdk.jmh.Main -jvmArgsAppend "--add-modules jdk.incubator.vector -XX:+PrintCompilation ${FLAGS[$c]}" \
              -rf csv -rff "out/pc-$c.csv" -f 20 -wi 4 -i 4 -w 1 -r 1 "review3.R3Bench.(vectorLoopMegamorphicCall|vectorLoopStaticCall)" > "out/pc-$c.log" 2>&1
            grep -E "^# Fork|^Iteration   4|R3Bench::|COMPILE SKIPPED|not compilable|made not entrant" "out/pc-$c.log" | grep -v "jmh_generated" > "out/pc-$c.txt"
            echo "== $c slow forks: $(grep -c -E '^Iteration   4: [0-9]{4}' out/pc-$c.log) of $(grep -c '^# Fork' out/pc-$c.log)"
          done
          JAVA[BA]="$basebin/java"; FLAGS[BA]="-XX:+UnlockExperimentalVMOptions -XX:CodeEntryAlignment=64 -XX:OptoLoopAlignment=32"
          JAVA[SA]="$bin/java"; FLAGS[SA]="-XX:+UnlockExperimentalVMOptions -XX:CodeEntryAlignment=64 -XX:OptoLoopAlignment=32"
          for round in 1 2 3 4; do
            case $round in 1) order="B S BA SA";; 2) order="S BA SA B";; 3) order="BA SA B S";; 4) order="SA B S BA";; esac
            for c in $order; do
              "${JAVA[$c]}" -cp "jmhc;$cp" org.openjdk.jmh.Main -jvmArgsAppend "--add-modules jdk.incubator.vector ${FLAGS[$c]}" \
                -rf csv -rff "out/jmh-$c-$round.csv" -f 5 -wi 5 -i 10 -w 1 -r 1 \
                "review3.R3Bench.(vectorLoopMegamorphicCall|vectorLoopStaticCall|vectorLoopNoCall)" > "out/jmh-$c-$round.log" 2>&1
            done
          done
          echo done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mega2-${{ matrix.slot }}
          path: out
          retention-days: 30
