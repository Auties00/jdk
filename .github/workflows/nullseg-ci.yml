name: 'JDK-8365196 nullseg CI'

# Review-only. Builds the notrap branch (windows-x64 and linux-x64, release and fastdebug) and tests
# AvoidLosableStateAtTraps: tier1 on linux-x64, windows-2022 (a kernel that keeps the state) and
# windows-2025 (Windows Server 2025, whose gated kernel loses it); the compiler groups and the vector
# tests on windows-2025 with the mode on by default; the linux-x64 compiler groups with the mode
# forced, so that its debug checks run on every compilation; and the reproducers on windows-2025 and
# windows-2022 with the notrap build (mode on, mode off) against the unpatched base and scrub14.
# Windows/AArch64 and the other Linux builds go through the OpenJDK GHA Sanity Checks (main.yml,
# dispatched on this branch).

on:
  push:
    branches:
      - 'JDK-8365196-ci-nullseg-*'

permissions:
  actions: read
  contents: read

env:
  # The unpatched base (2b376fb353c), as copied by run 45043642784.
  BASE_RUN: 46023299763
  # scrub14 (c6f997c2c66), as built by run 45112930164.
  SCRUB14_RUN: 46023299763
  # A notrap CI run of the branch before the cost branches (2fc793f7a63), for the bench.
  NOTRAP_RUN: 45896947412
  # The CI run of the integrated branch before this work (round 17, the code of e77590df934).
  BEFORE_RUN: 46062686610
  # The CI run of cost-kmask (73360dc3de3): the mode without the protection of the vectors that reach a check.
  KMASK_RUN: 45961686077
  JMH_ARGS: '-f 2 -wi 4 -i 6 -w 1 -r 1'

jobs:
  prepare:
    name: 'Prepare'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github
            make/conf/github-actions.conf
      - name: 'Build JTReg'
        uses: ./.github/actions/build-jtreg

  build-windows-x64:
    name: windows-x64
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      platform: windows-x64
      runs-on: windows-2022
      architecture: 'x86.x64'
      msvc-toolset-version: '14.44'

  copy-bundles:
    name: 'Copy the base and scrub14 bundles'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-base
          path: base
          run-id: ${{ env.BASE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-scrub14
          path: scrub14
          run-id: ${{ env.SCRUB14_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-windows-x64-base
          path: base
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles-windows-x64-scrub14
          path: scrub14
          retention-days: 30
          compression-level: 0

  build-linux-x64:
    name: linux-x64
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux-x64
      gcc-major-version: '10'

  compiler-forced-linux-x64:
    name: 'compiler, mode forced, linux-x64'
    needs: [prepare, build-linux-x64]
    uses: ./.github/workflows/test-scrub5.yml
    with:
      platform: linux-x64
      bootjdk-platform: linux-x64
      runs-on: ubuntu-24.04
      debug-suffix: -debug
      tag: forced
      java-options: '-XX:+UnlockDiagnosticVMOptions -XX:+AvoidLosableStateAtTraps'
      tests: '[{"test-name": "hs/tier1 compiler part 1", "test-suite": "test/hotspot/jtreg/:tier1_compiler_1", "debug-suffix": "-debug"}, {"test-name": "hs/tier1 compiler part 2", "test-suite": "test/hotspot/jtreg/:tier1_compiler_2", "debug-suffix": "-debug"}, {"test-name": "hs/tier1 compiler part 3", "test-suite": "test/hotspot/jtreg/:tier1_compiler_3", "debug-suffix": "-debug"}, {"test-name": "hs/tier2 compiler", "test-suite": "test/hotspot/jtreg/:tier2_compiler", "debug-suffix": "-debug"}, {"test-name": "hs/vector", "test-suite": "test/hotspot/jtreg/compiler/vectorapi test/hotspot/jtreg/compiler/vectorization", "debug-suffix": "-debug"}, {"test-name": "hs/safepoints", "test-suite": "test/hotspot/jtreg/compiler/runtime/safepoints", "debug-suffix": "-debug"}, {"test-name": "jdk/foreign", "test-suite": "test/jdk/java/foreign", "debug-suffix": "-debug"}]'

  compiler-windows-2025:
    name: 'vector, foreign, windows-2025'
    needs: [prepare, build-windows-x64]
    uses: ./.github/workflows/test-scrub5.yml
    with:
      platform: windows-x64
      bootjdk-platform: windows-x64
      architecture: 'x86.x64'
      runs-on: windows-2025
      debug-suffix: -debug
      tag: compiler-2025
      tests: '[{"test-name": "hs/vector", "test-suite": "test/hotspot/jtreg/compiler/vectorapi test/hotspot/jtreg/compiler/vectorization", "debug-suffix": "-debug"}, {"test-name": "jdk/vector", "test-suite": "test/jdk/jdk/incubator/vector"}, {"test-name": "jdk/foreign", "test-suite": "test/jdk/java/foreign"}, {"test-name": "hs/safepoints, mxcsr, c1", "test-suite": "test/hotspot/jtreg/compiler/runtime/safepoints test/hotspot/jtreg/runtime/jni/mxcsr test/hotspot/jtreg/compiler/c1", "debug-suffix": "-debug"}, {"test-name": "hs/tier1 compiler part 1", "test-suite": "test/hotspot/jtreg/:tier1_compiler_1", "debug-suffix": "-debug"}]'

  repro:
    name: repro (${{ matrix.os }}, ${{ matrix.slot }})
    needs: [prepare, build-windows-x64, copy-bundles]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
        slot: [1, 2]
        exclude:
          - { os: windows-2022, slot: 2 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: jtreg
        uses: ./.github/actions/get-jtreg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: bundles
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-base
          path: bundles-base
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64-scrub14
          path: bundles-scrub14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-windows-x64
          path: bundles-kmask
          run-id: ${{ env.KMASK_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Auties00/jdk-c2-avx512-windows-repro
          path: xstate-repro
      - name: 'The reproducers with notrap, its mode off, scrub14 and the base'
        run: |
          set +e
          mkdir -p out jdk base scrub14 kmask tests classes
          unzip -q bundles-kmask/jdk-windows-x64.zip -d kmask
          unzip -q bundles/jdk-windows-x64.zip -d jdk
          unzip -q bundles-base/jdk-windows-x64.zip -d base
          unzip -q bundles-scrub14/jdk-windows-x64.zip -d scrub14
          tar -xzf bundles/tests-windows-x64.tar.gz -C tests
          home() { (cd "$(dirname "$(find "$1" -name java.exe -path '*/bin/*' | head -1)")/.." && pwd -W); }
          JDK=$(home jdk); BASE=$(home base); SCRUB14=$(home scrub14); KMASK=$(home kmask)
          NAT=$(cd "$(dirname "$(find tests -name ExceptionXState.dll | head -1)")" && pwd -W)
          JT='${{ steps.jtreg.outputs.path }}'
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()" | tee out/cpu.txt
          powershell -NoProfile -Command "\$v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'; \"\$(\$v.ProductName) \$(\$v.CurrentBuild).\$(\$v.UBR)\"" | tee out/build.txt
          "$JDK/bin/java" -Xlog:os+cpu=info -version 2>&1 | grep -i -E "kernel|exception|xsave|xstate|capped|resumed" | tee out/jvm-detect.txt
          "$JDK/bin/java" -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version | grep -E ' (UseAVX|MaxVectorSize|UseAPX|AvoidLosableStateAtTraps|UseFPUForSpilling) ' | tee out/flags.txt
          clang -O2 -mxsave -o probe.exe xstate-repro/native/xstate_stale_header.c -ladvapi32 -lversion
          ./probe.exe > out/probe.txt 2>&1
          echo "SUMMARY native probe: $(grep -m1 '^RESULT' out/probe.txt)" | tee out/summary.txt
          # jtreg: TestExceptionXStateLoss (stale header planted) and the notrap stress test
          jt() {
            local tag=$1 jdk=$2 opts=$3 test=$4
            "$JDK/bin/java" -jar "$JT/lib/jtreg.jar" -jdk:"$jdk" -nativepath:"$NAT" -w "wk/$tag" -r "rp/$tag" \
              -timeoutFactor:4 -verbose:summary -vmoptions:"-XX:-CreateCoredumpOnCrash $opts" $test > "out/jtreg-$tag.txt" 2>&1
            local pass=$(grep -c '^Passed: ' "out/jtreg-$tag.txt")
            local fail=$(grep -c -E '^(FAILED|Error): ' "out/jtreg-$tag.txt")
            mkdir -p "out/jtr/$tag"; find "wk/$tag" -name '*.jtr' -exec cp {} "out/jtr/$tag/" \; 2>/dev/null
            local wrong=$(cat out/jtr/$tag/*.jtr 2>/dev/null | grep -o 'calls=[0-9]* wrong=[0-9]*' | tr '\n' ' ')
            echo "SUMMARY [$tag] passed=$pass failed=$fail $(grep -E '^(FAILED|Error): ' "out/jtreg-$tag.txt" | sed 's/.*#//' | tr '\n' ' ') :: $wrong" | tee -a out/summary.txt
          }
          SCRUB=test/hotspot/jtreg/compiler/runtime/safepoints/TestExceptionXStateLoss.java
          NOTRAP=test/hotspot/jtreg/compiler/runtime/safepoints/TestAvoidLosableStateAtTraps.java
          OFF="-XX:+UnlockDiagnosticVMOptions -XX:-AvoidLosableStateAtTraps"
          for r in 1 2; do
            jt "notrap-$r" "$JDK" "" "$SCRUB"
            jt "notrap-off-$r" "$JDK" "$OFF" "$SCRUB"
            jt "base-$r" "$BASE" "" "$SCRUB"
          done
          jt "scrub14-1" "$SCRUB14" "" "$SCRUB"
          jt "notrap-stress" "$JDK" "" "$NOTRAP"
          jt "kmask-masks" "$JDK" "" test/hotspot/jtreg/compiler/runtime/safepoints/TestMaskKillAtRawAccesses.java
          jt "c1-notrap" "$JDK" "" test/hotspot/jtreg/compiler/runtime/safepoints/TestExceptionXStateLossC1.java
          jt "c1-notrap-off" "$JDK" "$OFF" test/hotspot/jtreg/compiler/runtime/safepoints/TestExceptionXStateLossC1.java
          # The vectors that a check reads after a raw access, with a page error at the access (a file mapped
          # from a virtual disk that is detached): the integrated build, the same with the mode off, cost-kmask
          # (the mode without the protection of those vectors) and the base.
          holes() {
            local tag=$1 jdk=$2 opts=$3
            jt "$tag" "$jdk" "-Dtest.xstate.vhd=true -Dtest.xstate.fill=true $opts" test/hotspot/jtreg/compiler/runtime/safepoints/TestCheckedVectorsAtRawAccesses.java
            for j in out/jtr/$tag/*.jtr; do
              echo "SUMMARY [$tag] $(basename $j): $(grep -E '^(laneCheckKernel|gatherKernel|userCheckKernel|page error|Native probe)|SkippedException|^execStatus' "$j" | tr '\n' ';' | cut -c1-600)" | tee -a out/summary.txt
            done
          }
          for r in 1 2; do
            holes "holes-notrap-$r" "$JDK" ""
            holes "holes-kmask-$r" "$KMASK" ""
            holes "holes-notrap-off-$r" "$JDK" "$OFF"
          done
          holes "holes-base-1" "$BASE" ""
          jt "base-stress" "$BASE" "" "$NOTRAP"
          # Repro.java, the standalone reproducer, as java.yml runs it
          "$JDK/bin/javac" --add-modules jdk.incubator.vector -d classes xstate-repro/Repro.java 2>&1 | grep -v -i warning
          repro() {
            local tag=$1 java=$2 seed=$3; shift 3
            local code=0 result
            rm -f hs_err_*.log
            "$java/bin/java" -XX:+UnlockDiagnosticVMOptions -XX:+SafepointALot -XX:GuaranteedSafepointInterval=1 \
              -XX:+StressGCM -XX:+StressLCM -XX:StressSeed="$seed" "$@" -XX:-CreateCoredumpOnCrash -XX:ErrorFile=hs_err_%p.log \
              --add-modules jdk.incubator.vector -cp classes Repro 10 4 > "out/repro-$tag-$seed.log" 2>&1 || code=$?
            if ls hs_err_*.log > /dev/null 2>&1; then
              result="CRASH ($(grep -m1 '^siginfo' hs_err_*.log | sed 's/^siginfo: //'))"; mv "$(ls hs_err_*.log | head -1)" "out/repro-$tag-$seed.hs_err.log"
            elif [ $code = 3 ]; then result="WRONG ($(grep -m1 '^calls' "out/repro-$tag-$seed.log"))"
            elif [ $code = 0 ]; then result="ok ($(grep -m1 '^calls' "out/repro-$tag-$seed.log"))"
            else result="exit $code"; fi
            echo "SUMMARY [repro $tag seed $seed ${*:-}] $result" | tee -a out/summary.txt
          }
          for seed in 13 18 25 39 54; do
            repro notrap "$JDK" $seed
            repro base "$BASE" $seed
          done
          for seed in 13 25; do
            repro notrap-nofpu "$JDK" $seed -XX:-UseFPUForSpilling
            repro base-nofpu "$BASE" $seed -XX:-UseFPUForSpilling
          done
          { echo "### $(cat out/cpu.txt) | $(cat out/build.txt)"; echo '```'; cat out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: repro-${{ matrix.os }}-${{ matrix.slot }}
          path: out
          retention-days: 30

  asm:
    name: 'the code of the kernels (linux-x64 fastdebug)'
    needs: build-linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src
          sparse-checkout: |
            review9
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-linux-x64-debug
          path: b-new
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-linux-x64-debug
          path: b-prev
          run-id: ${{ env.BEFORE_RUN }}
          github-token: ${{ github.token }}
      - name: 'PrintOptoAssembly of the review9 kernels under JMH: before (P), now (N), now with the mode off (O), UseAVX=2 and 3'
        run: |
          set +e
          mkdir -p out new prev
          tar -xzf "$(ls b-new/jdk-linux-x64*.tar.gz | grep -v symbols | grep -v static | head -1)" -C new
          tar -xzf "$(ls b-prev/jdk-linux-x64*.tar.gz | grep -v symbols | grep -v static | head -1)" -C prev
          NJ=$(dirname "$(find new -name java -path '*/bin/*' -type f | head -1)")
          PJ=$(dirname "$(find prev -name java -path '*/bin/*' -type f | head -1)")
          grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //' | tee out/cpu.txt
          "$NJ/java" -version 2>&1 | tee out/version.txt
          m2=https://repo1.maven.org/maven2
          for a in org/openjdk/jmh/jmh-core/1.37/jmh-core-1.37.jar org/openjdk/jmh/jmh-generator-annprocess/1.37/jmh-generator-annprocess-1.37.jar net/sf/jopt-simple/jopt-simple/5.0.4/jopt-simple-5.0.4.jar org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar; do
            curl -sfL --retry 6 --retry-all-errors --retry-delay 5 -o "lib-$(basename $a)" "$m2/$a" || echo "download failed: $a"
          done
          cp="lib-jmh-core-1.37.jar:lib-jopt-simple-5.0.4.jar:lib-commons-math3-3.6.1.jar"
          "$NJ/javac" --add-modules jdk.incubator.vector -proc:full -cp "$cp:lib-jmh-generator-annprocess-1.37.jar" -d jmhc src/review9/*.java 2>&1 | grep -v -i warning | tail -5
          avxs="2"; grep -q avx512vl /proc/cpuinfo && avxs="2 3"
          one() {
            local c=$1 avx=$2 k=$3 java flags
            case $c in
              P) java="$PJ/java"; flags="-XX:+AvoidLosableStateAtTraps";;
              N) java="$NJ/java"; flags="-XX:+AvoidLosableStateAtTraps";;
              O) java="$NJ/java"; flags="-XX:-AvoidLosableStateAtTraps";;
            esac
            "$java" -cp "jmhc:$cp" org.openjdk.jmh.Main               -jvmArgsAppend "--add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow -XX:+UnlockDiagnosticVMOptions $flags -XX:UseAVX=$avx -XX:CompileCommand=quiet -XX:CompileCommand=PrintOptoAssembly,*::$k -XX:+TraceLoopPredicate -XX:+PrintOptoStatistics"               -f 1 -wi 3 -i 1 -w 1 -r 1 "review9.*\.$k\$" > "out/asm-$c-avx$avx-$k.log" 2>&1
            echo "$c avx$avx $k: compilations $(grep -c 'OptoAssembly for' "out/asm-$c-avx$avx-$k.log"), null checks $(grep -c 'NullCheck' "out/asm-$c-avx$avx-$k.log"), explicit $(grep -c 'explicit null check' "out/asm-$c-avx$avx-$k.log"), $(grep -E 'AvoidLosableStateAtTraps: ' "out/asm-$c-avx$avx-$k.log" | tail -1)"
          }
          export -f one; export NJ PJ cp
          for avx in $avxs; do
            for k in segmentMaskedSum segmentCompareBlendStore unsafeWithLiveMask heapMaskedSum heapCompareBlendStore tailMaskedCopy compareAcrossLoad compareAcrossLoadMaskedStore constantMaskPredicate; do
              for c in P N O; do echo "$c $avx $k"; done
            done
          done | xargs -P 4 -L 1 bash -c 'one $0 $1 $2' | sort | tee out/summary.txt
          { echo "### $(cat out/cpu.txt)"; echo '```'; cat out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: asm-linux
          path: out
          retention-days: 30
