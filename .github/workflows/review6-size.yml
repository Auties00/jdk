name: 'JDK-8365196 review6: code size of the scrubs'

# Review-only (review6). Same scrub8 release binary (run 44637207461), with the scrub off
# (default on Linux) and forced (ExceptionXStateLength=1920 / 320): C2 code size under -Xcomp for
# javac compiling a file, and for a Vector API workload (R6 kernels), plus wall time.

on:
  push:
    branches:
      - 'JDK-8365196-review6-size*'

permissions:
  actions: read
  contents: read

env:
  RUN: 44637207461

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            review6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: bundles-linux-x64, path: b-new, run-id: '${{ env.RUN }}', github-token: '${{ github.token }}' }
      - name: 'Run'
        run: |
          set +e
          mkdir -p out new
          tar -xzf "$(ls b-new/jdk-linux-x64*.tar.gz | grep -v symbols | grep -v debug | head -1)" -C new
          NEW=$(cd "$(dirname "$(find new -name java -path '*/bin/*' -type f | head -1)")/.." && pwd)
          grep -m1 'model name' /proc/cpuinfo > out/cpu.txt
          for gc in Serial G1 Z Shenandoah; do
            for L in 0 1920; do
              f=out/xcomp-$gc-L$L.txt
              "$NEW/bin/java" -XX:+Use${gc}GC -Xcomp -XX:-TieredCompilation -XX:+UnlockDiagnosticVMOptions -XX:ExceptionXStateLength=$L -XX:+CITime -version > $f 2>&1
              echo "xcomp-version $gc L=$L $(grep -o 'nmethod code size.*' $f)" >> out/summary.txt
              for r in 1 2 3; do
                f=out/javac-$gc-L$L-$r.txt
                s=$(date +%s%N)
                "$NEW/bin/java" -XX:+Use${gc}GC -XX:+UnlockDiagnosticVMOptions -XX:ExceptionXStateLength=$L -XX:+CITime                   -m jdk.compiler/com.sun.tools.javac.Main -d out/cls review6/java/R6.java review6/java/R5Conn.java > $f 2>&1
                e=$(date +%s%N)
                echo "javac $gc L=$L run=$r wall_ms=$(( (e-s)/1000000 )) C2: $(grep -m1 '^  C2 {' $f | grep -o 'nmethods_code_size: [0-9]*')" >> out/summary.txt
              done
            done
          done
          cat out/summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: r6-size
          path: out
          retention-days: 30
