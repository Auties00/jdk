name: 'JDK-8365196 kmask CI'

# Review-only. A closer look at the kernels of review9 with the linux bundles of an earlier kmask CI run (N) and of
# the notrap branch before (T): which raw accesses kill and which masks are protected in each fork of JMH, and
# PrintOptoAssembly of the kernels. Several slots, because only some of the runners have AVX-512.

on:
  push:
    branches:
      - 'JDK-8365196-ci-kmask-*'

permissions:
  actions: read
  contents: read

env:
  KMASK_RUN: 45922041286
  NOTRAP_RUN: 45896947412
  JMH_ARGS: '-f 2 -wi 4 -i 6 -w 1 -r 1'

jobs:
  look:
    name: look (${{ matrix.slot }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: src
          sparse-checkout: |
            review9
            kmask
      - name: 'AVX-512?'
        id: cpu
        run: |
          grep -m1 'model name' /proc/cpuinfo
          if grep -q avx512vl /proc/cpuinfo; then echo "avx512=true" >> $GITHUB_OUTPUT; else echo "avx512=false" >> $GITHUB_OUTPUT; fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.cpu.outputs.avx512 == 'true'
        with:
          name: bundles-linux-x64
          path: n-release
          run-id: ${{ env.KMASK_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.cpu.outputs.avx512 == 'true'
        with:
          name: bundles-linux-x64-debug
          path: n-debug
          run-id: ${{ env.KMASK_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.cpu.outputs.avx512 == 'true'
        with:
          name: bundles-linux-x64
          path: b-release
          run-id: ${{ env.NOTRAP_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.cpu.outputs.avx512 == 'true'
        with:
          name: bundles-linux-x64-debug
          path: b-debug
          run-id: ${{ env.NOTRAP_RUN }}
          github-token: ${{ github.token }}
      - name: 'Look'
        if: steps.cpu.outputs.avx512 == 'true'
        run: |
          set +e
          mkdir -p out base-release base-debug new-release new-debug jtreg
          for l in release debug; do
            tar -xzf "$(ls b-$l/jdk-linux-x64*.tar.gz | grep -v symbols | grep -v static | head -1)" -C base-$l
            tar -xzf "$(ls n-$l/jdk-linux-x64*.tar.gz | grep -v symbols | grep -v static | head -1)" -C new-$l
          done
          export SLOT=look${{ matrix.slot }}
          bash src/kmask/look.sh
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.cpu.outputs.avx512 == 'true'
        with:
          name: klook-${{ matrix.slot }}
          path: out
          retention-days: 30

  wbench:
    name: bench (windows-2025, ${{ matrix.slot }})
    runs-on: windows-2025
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        shell: bash
    steps:
      - name: 'AVX-512?'
        id: cpu
        run: |
          n=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()")
          echo "$n"
          case "$n" in *7763*) echo "avx512=false" >> $GITHUB_OUTPUT;; *) echo "avx512=true" >> $GITHUB_OUTPUT;; esac
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.cpu.outputs.avx512 == 'true'
        with:
          path: src
          sparse-checkout: |
            review9
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.cpu.outputs.avx512 == 'true'
        with:
          name: bundles-windows-x64
          path: b-new
          run-id: ${{ env.KMASK_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.cpu.outputs.avx512 == 'true'
        with:
          name: bundles-windows-x64-base
          path: b-base
          run-id: ${{ env.KMASK_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.cpu.outputs.avx512 == 'true'
        with:
          name: bundles-windows-x64
          path: b-prev
          run-id: ${{ env.NOTRAP_RUN }}
          github-token: ${{ github.token }}
      - name: 'JMH and Renaissance: base (B), notrap before (P), cost-kmask (N), cost-kmask mode off (O)'
        if: steps.cpu.outputs.avx512 == 'true'
        run: |
          set +e
          mkdir -p out new base prev
          unzip -q b-new/jdk-windows-x64.zip -d new; unzip -q b-base/jdk-windows-x64.zip -d base; unzip -q b-prev/jdk-windows-x64.zip -d prev
          bin() { dirname "$(find "$1" -name java.exe -path '*/bin/*' | head -1)"; }
          NBIN=$(bin new); BBIN=$(bin base); PBIN=$(bin prev)
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()" | tee out/cpu.txt
          powershell -NoProfile -Command "\$v = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'; \"\$(\$v.ProductName) \$(\$v.CurrentBuild).\$(\$v.UBR)\"" | tee out/build.txt
          "$NBIN/java" -XX:+UnlockDiagnosticVMOptions -XX:+PrintFlagsFinal -version | grep -E ' (UseAVX|MaxVectorSize|AvoidLosableStateAtTraps) ' | tee out/flags.txt
          m2=https://repo1.maven.org/maven2
          for a in org/openjdk/jmh/jmh-core/1.37/jmh-core-1.37.jar org/openjdk/jmh/jmh-generator-annprocess/1.37/jmh-generator-annprocess-1.37.jar net/sf/jopt-simple/jopt-simple/5.0.4/jopt-simple-5.0.4.jar org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar; do
            curl -sfL -o "lib-$(basename $a)" "$m2/$a" || echo "download failed: $a"
          done
          cp="lib-jmh-core-1.37.jar;lib-jopt-simple-5.0.4.jar;lib-commons-math3-3.6.1.jar"
          "$BBIN/javac" --add-modules jdk.incubator.vector -proc:full -cp "$cp;lib-jmh-generator-annprocess-1.37.jar" -d jmhc src/review9/*.java 2>&1 | grep -v -i warning | tail -5
          for v in 0.16.1 0.16.0 0.15.0; do
            curl -sfL -o renaissance.jar "https://github.com/renaissance-benchmarks/renaissance/releases/download/v$v/renaissance-gpl-$v.jar" && break
          done
          declare -A JAVA FLAGS
          JAVA[B]="$BBIN/java"; FLAGS[B]=""
          JAVA[P]="$PBIN/java"; FLAGS[P]=""
          JAVA[N]="$NBIN/java"; FLAGS[N]=""
          JAVA[O]="$NBIN/java"; FLAGS[O]="-XX:+UnlockDiagnosticVMOptions -XX:-AvoidLosableStateAtTraps"
          for round in 1 2 3; do
            order="B P N O"; [ $round = 2 ] && order="P N O B"; [ $round = 3 ] && order="N O B P"
            for c in $order; do
              "${JAVA[$c]}" -cp "jmhc;$cp" org.openjdk.jmh.Main                 -jvmArgsAppend "--add-modules jdk.incubator.vector --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow ${FLAGS[$c]}"                 -rf csv -rff "out/jmh-$c-$round.csv" $JMH_ARGS "review9" > "out/jmh-$c-$round.log" 2>&1
              tail -14 "out/jmh-$c-$round.log"
            done
          done
          RB="scrabble future-genetic mnemonics fj-kmeans dotty"
          for round in 1 2; do
            order="P N"; [ $round = 2 ] && order="N P"
            for b in $RB; do
              for c in $order; do
                timeout 900 "${JAVA[$c]}" ${FLAGS[$c]} -Xms2g -Xmx2g -jar renaissance.jar -r 12 --csv "out/ren-$b-$c-$round.csv" $b > "out/ren-$b-$c-$round.log" 2>&1 || echo "renaissance $b $c failed"
              done
            done
          done
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.cpu.outputs.avx512 == 'true'
        with:
          name: kbench512-windows-2025-${{ matrix.slot }}
          path: out
          retention-days: 30
